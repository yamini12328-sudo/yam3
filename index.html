function Icon({ name, size = 20, className = '', strokeWidth = 2 }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      window.lucide.createIcons({ 
        icons: window.lucide.icons,
        nameAttr: 'data-lucide',
        attrs: { 'stroke-width': strokeWidth }
      });
    }
  });
  return <i ref={ref} data-lucide={name} style={{ width: size, height: size, display: 'inline-block' }} className={className}></i>;
}

function loadFromStorage(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (!raw) return fallback;
    return JSON.parse(raw);
  } catch (e) { return fallback; }
}
function saveToStorage(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
}
function useLocalStorage(key, initial) {
  const [value, setValue] = useState(() => loadFromStorage(key, initial));
  useEffect(() => { saveToStorage(key, value); }, [key, value]);
  return [value, setValue];
}

function findTopic(query) {
  const q = query.toLowerCase();
  for (const key of Object.keys(TOPIC_KNOWLEDGE)) {
    if (q.includes(key)) return key;
  }
  const map = {
    'supervised':'supervised learning','normaliz':'normalization','polymorph':'polymorphism',
    'cloud':'cloud computing','neural':'neural networks','join':'sql joins','recursi':'recursion',
  };
  for (const frag of Object.keys(map)) {
    if (q.includes(frag)) return map[frag];
  }
  return null;
}

const delay = (ms) => new Promise((r) => setTimeout(r, ms));

const aiService = {
  async askQuestion(question, mode = 'detailed') {
    await delay(600 + Math.random() * 500);
    const topic = findTopic(question);
    if (topic) {
      const k = TOPIC_KNOWLEDGE[topic];
      if (mode === 'beginner') return `**${topic} — Simple Explanation**\n\n${k.simple}\n\n**Example**\n\n${k.example}`;
      if (mode === 'exam') return `**${topic} — Exam Answer**\n\n**Definition:** ${k.simple}\n\n**Key Points:**\n${k.keyPoints.map(p=>`- ${p}`).join('\n')}`;
      if (mode === 'revision') return `**${topic} — Quick Revision**\n\n${k.keyPoints.map(p=>`• ${p}`).join('\n')}`;
      return `**${topic} — Detailed Explanation**\n\n${k.detailed}\n\n**Example**\n\n${k.example}\n\n**Key Points**\n\n${k.keyPoints.map(p=>`- ${p}`).join('\n')}`;
    }
    if (question.toLowerCase().includes('quiz')) {
      return `I'd be happy to quiz you! Head over to the **Quiz Generator** page and select a subject and topic.`;
    }
    return `Here's what I can tell you about "${question.trim()}":\n\n**Overview**\nThis is an important topic. The key is to break it into (1) the core definition, (2) how it works, (3) real-world applications, and (4) common pitfalls.\n\n**Suggestions:**\n- Try the **Summarizer** with your notes\n- Generate a **Quiz**\n- Create **Flashcards**`;
  },

  async summarizeText(text, mode = 'medium') {
    await delay(800);
    const trimmed = (text || '').trim();
    if (!trimmed) {
      return { summary:'No content provided.', concepts:[], keyPoints:[], definitions:[], examples:[] };
    }
    const sentences = trimmed.split(/(?<=[.!?])\s+/).filter(s => s.length > 10);
    const summaryLen = mode === 'short' ? 2 : mode === 'medium' ? 4 : mode === 'detailed' ? 6 : 3;
    const summary = sentences.slice(0, summaryLen).join(' ');
    const words = trimmed.toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(w => w.length > 4);
    const freq = {};
    words.forEach(w => freq[w] = (freq[w]||0)+1);
    const concepts = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([w])=>w.charAt(0).toUpperCase()+w.slice(1));
    const keyPoints = sentences.slice(0,5);
    const definitions = concepts.slice(0,3).map(c => ({ term:c, definition:`Key concept in this material — appears frequently and is likely exam-relevant.` }));
    const examples = sentences.filter(s => /for example|e\.g\.|such as/i.test(s)).slice(0,3);
    if (examples.length === 0) examples.push('No explicit examples found in the text.');
    return {
      summary: `**${mode.toUpperCase()} Summary**\n\n${summary}`,
      concepts, keyPoints, definitions, examples,
    };
  },

  async generateQuiz({ subject, topic, difficulty, count, types }) {
    await delay(900);
    const pool = QUESTION_BANK.filter(q =>
      (subject === 'Any' || q.subject === subject) &&
      (!topic || q.topic.toLowerCase().includes(topic.toLowerCase()) || q.topic === 'General')
    );
    const base = pool.length > 0 ? pool : QUESTION_BANK;
    const filtered = base.filter(q => !types || types.length === 0 || types.includes(q.type));
    const source = filtered.length > 0 ? filtered : QUESTION_BANK;
    const questions = [];
    for (let i = 0; i < count; i++) {
      const q = source[i % source.length];
      questions.push({ ...q, id: uid('q'), difficulty, subject, topic: topic || q.topic });
    }
    return questions;
  },

  async generateFlashcards({ subject, topic, count }) {
    await delay(700);
    const pool = DEMO_FLASHCARDS.filter(c =>
      (subject === 'Any' || c.subject === subject) &&
      (!topic || c.topic.toLowerCase().includes(topic.toLowerCase()))
    );
    const source = pool.length > 0 ? pool : DEMO_FLASHCARDS;
    const cards = [];
    for (let i = 0; i < count; i++) {
      const c = source[i % source.length];
      cards.push({ ...c, id: uid('f'), status:'new' });
    }
    return cards;
  },

  async generateExamAnswer({ topic, marks, simple }) {
    await delay(800);
    const found = findTopic(topic);
    if (found) {
      const k = TOPIC_KNOWLEDGE[found];
      return {
        definition: k.simple,
        introduction: `Understanding ${found} is essential for any student in this field. Below is a structured answer suitable for a ${marks}-mark question.`,
        mainPoints: k.keyPoints,
        explanation: simple ? k.simple : k.detailed,
        examples: k.example,
        conclusion: `In summary, ${found} is a fundamental concept. Mastering it strengthens your overall understanding and exam readiness.`,
      };
    }
    return {
      definition: `${topic} refers to a key concept in your syllabus that requires structured understanding.`,
      introduction: `This answer addresses "${topic}" in a ${marks}-mark format with clear structure.`,
      mainPoints: [
        'Clear definition of the core idea',
        'How it works step-by-step',
        'Key characteristics and features',
        'Real-world applications',
        'Advantages and limitations',
      ],
      explanation: simple
        ? `In simple terms, ${topic} can be understood as a way to solve specific problems by applying fundamental principles step by step.`
        : `A detailed treatment of ${topic} includes its formal definition, underlying theory, operational mechanism, and case examples. It is often contrasted with related concepts to highlight its unique properties.`,
      examples: `A common example of ${topic} appears in real-world systems and academic problems where structured reasoning is required.`,
      conclusion: `Therefore, ${topic} plays a crucial role and should be studied thoroughly for both conceptual clarity and exam performance.`,
    };
  },

  async generateStudyPlan({ subjects, examDate, hoursPerDay }) {
    await delay(700);
    const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
    const tasks = [];
    const subjectList = subjects.length > 0 ? subjects : ['General Study'];
    let idx = 0;
    days.forEach(day => {
      const blocks = Math.max(1, Math.floor(hoursPerDay));
      for (let b = 0; b < blocks; b++) {
        const start = 18 + b * 1.25;
        const startH = Math.floor(start);
        const startM = Math.round((start - startH) * 60);
        const endH = Math.floor(start + 0.9);
        const endM = Math.round((start + 0.9 - endH) * 60);
        tasks.push({
          id: uid('task'),
          day,
          startTime: `${pad(startH)}:${pad(startM)}`,
          endTime: `${pad(endH)}:${pad(endM)}`,
          subject: subjectList[idx % subjectList.length],
          topic: 'Focused Study Session',
          priority: 'Medium',
          completed: false,
        });
        idx++;
      }
    });
    return tasks;
  },
};

function Button({ children, variant='primary', size='md', className='', icon, iconRight, ...props }) {
  const base = 'inline-flex items-center justify-center gap-2 font-semibold rounded-xl transition-all duration-200 disabled:opacity-50 disabled:cursor-not-allowed';
  const sizes = { sm:'px-3 py-1.5 text-sm', md:'px-4 py-2 text-sm', lg:'px-6 py-3 text-base' };
  const variants = {
    primary: 'bg-brand-600 hover:bg-brand-700 text-white shadow-sm hover:shadow-md',
    secondary: 'bg-white hover:bg-slate-50 text-slate-700 border border-slate-200 shadow-sm',
    ghost: 'hover:bg-slate-100 text-slate-700',
    danger: 'bg-red-500 hover:bg-red-600 text-white',
    accent: 'bg-accent-600 hover:bg-accent-700 text-white',
    outline: 'border border-brand-600 text-brand-700 hover:bg-brand-50',
  };
  return (
    <button className={`${base} ${sizes[size]} ${variants[variant]} ${className}`} {...props}>
      {icon && <Icon name={icon} size={size === 'sm' ? 14 : 16} />}
      {children}
      {iconRight && <Icon name={iconRight} size={size === 'sm' ? 14 : 16} />}
    </button>
  );
}

function Card({ children, className='', padding='p-5' }) {
  return <div className={`bg-white rounded-2xl shadow-card border border-slate-100 ${padding} ${className}`}>{children}</div>;
}

function Input({ label, error, className='', ...props }) {
  return (
    <div className={className}>
      {label && <label className="block text-sm font-medium text-slate-700 mb-1.5">{label}</label>}
      <input
        className="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-slate-800 text-sm placeholder:text-slate-400 focus:border-brand-500 focus:ring-2 focus:ring-brand-100 transition-all"

      />
      {error && <p className="text-xs text-red-500 mt-1">{error}</p>}

}

function Textarea({ label, className='', rows=6, ...props }) {

      <select

function ToastProvider({ children }) {

  const show = useCallback((message, type='info') => {
    const id = uid('toast');
    setToasts(t => [...t, { id, message, type }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3200);
  }, []);
  return (
    <ToastContext.Provider value={{ show }}>
      {children}
      <div className="fixed bottom-4 right-4 z-[100] space-y-2">
        {toasts.map(t => (
          <div key={t.id} className={`px-4 py-3 rounded-xl shadow-lg text-sm font-medium text-white animate-fade-in flex items-center gap-2 ${
            t.type === 'success' ? 'bg-emerald-600' : t.type === 'error' ? 'bg-red-600' : 'bg-slate-800'
          }`}>
            <Icon name={t.type === 'success' ? 'check-circle' : t.type === 'error' ? 'alert-circle' : 'info'} size={16} />
            {t.message}
          </div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}
const useToast = () => React.useContext(ToastContext);

/* =========================== MARKDOWN RENDERER =========================== */
function Markdown({ text }) {
  const html = useMemo(() => {
    if (!text) return '';
    let t = text;
    // Code blocks
    t = t.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => `<pre><code>${code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</code></pre>`);
    // Headers
    t = t.replace(/^### (.*$)/gm, '<h3>$1</h3>');
    t = t.replace(/^## (.*$)/gm, '<h3>$1</h3>');
    // Bold
    t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    // Inline code
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    // Lists
    t = t.replace(/^\- (.*$)/gm, '<li>$1</li>');
    t = t.replace(/^• (.*$)/gm, '<li>$1</li>');
    t = t.replace(/(<li>.*<\/li>)/s, '<ul>$1</ul>');
    // Paragraphs
    t = t.split('\n\n').map(p => {
      if (p.startsWith('<') || p.trim() === '') return p;
      return `<p>${p}</p>`;
    }).join('');
    return t.replace(/\n/g, '<br/>');
  }, [text]);
  return <div className="prose-answer text-sm leading-relaxed" dangerouslySetInnerHTML={{ __html: html }} />;
}

/* =========================== ROUTER (Hash-based) =========================== */
function useHashRoute() {
  const [hash, setHash] = useState(() => window.location.hash.slice(1) || '/');
  useEffect(() => {
    const onHash = () => setHash(window.location.hash.slice(1) || '/');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const navigate = useCallback((to) => { window.location.hash = to; window.scrollTo(0,0); }, []);
  return [hash, navigate];
}

/* =========================== POMODORO TIMER =========================== */
function PomodoroTimer({ compact=false }) {
  const [config, setConfig] = useLocalStorage(STORAGE_KEYS.POMODORO, { study:25, break:5, sessions:0, today:todayDate() });
  const [mode, setMode] = useState('study');
  const [secondsLeft, setSecondsLeft] = useState(config.study * 60);
  const [running, setRunning] = useState(false);
  const [editing, setEditing] = useState(false);
  const [draftStudy, setDraftStudy] = useState(config.study);
  const [draftBreak, setDraftBreak] = useState(config.break);
  const toast = useToast();

  useEffect(() => {
    if (config.today !== todayDate()) setConfig({ ...config, sessions:0, today:todayDate() });
  }, []); // eslint-disable-line

  useEffect(() => {
    if (!running) return;
    if (secondsLeft <= 0) {
      setRunning(false);
      if (mode === 'study') {
        setConfig(c => ({ ...c, sessions: c.sessions + 1 }));
        toast('Focus session complete! Take a break ☕', 'success');
        setMode('break'); setSecondsLeft(config.break * 60);
      } else {
        toast('Break over — time to focus!', 'info');
        setMode('study'); setSecondsLeft(config.study * 60);
      }
      return;
    }
    const t = setTimeout(() => setSecondsLeft(s => s - 1), 1000);
    return () => clearTimeout(t);
  }, [running, secondsLeft, mode, config]); // eslint-disable-line

  const total = (mode === 'study' ? config.study : config.break) * 60;
  const pct = ((total - secondsLeft) / total) * 100;
  const mm = pad(Math.floor(secondsLeft / 60));
  const ss = pad(secondsLeft % 60);

  const reset = () => { setRunning(false); setSecondsLeft((mode === 'study' ? config.study : config.break) * 60); };
  const switchMode = (m) => { setMode(m); setRunning(false); setSecondsLeft((m === 'study' ? config.study : config.break) * 60); };

  const saveConfig = () => {
    setConfig(c => ({ ...c, study:draftStudy, break:draftBreak }));
    setSecondsLeft((mode === 'study' ? draftStudy : draftBreak) * 60);
    setEditing(false);
    toast('Timer settings updated', 'success');
  };

  if (compact) {
    return (
      <div className="flex items-center gap-3">
        <div className={`w-9 h-9 rounded-full flex items-center justify-center ${mode === 'study' ? 'bg-brand-100 text-brand-600' : 'bg-emerald-100 text-emerald-600'}`}>
          <Icon name={mode === 'study' ? 'brain' : 'coffee'} size={16} />
        </div>
        <div>
          <div className="font-mono font-bold text-slate-800">{mm}:{ss}</div>
          <div className="text-[10px] text-slate-500">{mode === 'study' ? 'Focus' : 'Break'} · {config.sessions} today</div>
        </div>
        <button onClick={() => setRunning(r => !r)} className="ml-auto p-1.5 rounded-lg hover:bg-slate-100 text-slate-600"><Icon name={running ? 'pause' : 'play'} size={16} /></button>
      </div>
    );
  }

  return (
    <Card>
      <div className="flex items-center justify-between mb-4">
        <h3 className="font-semibold flex items-center gap-2"><Icon name="timer" size={18} className="text-brand-600" /> Pomodoro Timer</h3>
        <button onClick={() => setEditing(!editing)} className="text-xs text-brand-600 font-medium hover:underline">{editing ? 'Cancel' : 'Customize'}</button>
      </div>

      {editing ? (
        <div className="space-y-3 mb-4">
          <Input label="Study duration (min)" type="number" min="1" value={draftStudy} onChange={e => setDraftStudy(parseInt(e.target.value)||1)} />
          <Input label="Break duration (min)" type="number" min="1" value={draftBreak} onChange={e => setDraftBreak(parseInt(e.target.value)||1)} />
          <Button onClick={saveConfig} className="w-full" icon="check">Save Settings</Button>
        </div>
      ) : (
        <>
          <div className="flex justify-center gap-2 mb-4">
            <button onClick={() => switchMode('study')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${mode==='study'?'bg-brand-600 text-white':'bg-slate-100 text-slate-600'}`}>Study</button>
            <button onClick={() => switchMode('break')} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${mode==='break'?'bg-emerald-600 text-white':'bg-slate-100 text-slate-600'}`}>Break</button>
          </div>
          <div className="relative w-40 h-40 mx-auto mb-4">
            <svg viewBox="0 0 100 100" className="w-full h-full -rotate-90">
              <circle cx="50" cy="50" r="45" fill="none" stroke="#e2e8f0" strokeWidth="6" />
              <circle cx="50" cy="50" r="45" fill="none" stroke={mode==='study'?'#3b6dfb':'#10b981'} strokeWidth="6" strokeDasharray={`${2*Math.PI*45}`} strokeDashoffset={`${2*Math.PI*45*(1-pct/100)}`} strokeLinecap="round" className="transition-all duration-1000" />
            </svg>
            <div className="absolute inset-0 flex flex-col items-center justify-center">
              <div className="font-mono font-extrabold text-3xl text-slate-800">{mm}:{ss}</div>
              <div className="text-xs text-slate-500 mt-1">{mode === 'study' ? 'Focus Time' : 'Break Time'}</div>
            </div>
          </div>
          <div className="flex gap-2">
            <Button onClick={() => setRunning(r => !r)} className="flex-1" icon={running ? 'pause' : 'play'}>{running ? 'Pause' : 'Start'}</Button>
            <Button onClick={reset} variant="secondary" icon="rotate-ccw">Reset</Button>
          </div>
          <div className="mt-4 text-center text-xs text-slate-500">
            Today's Focus Sessions: <span className="font-bold text-brand-600">{config.sessions}</span>
          </div>
        </>
      )}
    </Card>
  );
}

/* -------- Dashboard -------- */
function Dashboard({ navigate, notes, tasks, setTasks, exams, quizHistory, sessions }) {
  const toast = useToast();
  const today = new Date().toLocaleDateString('en-US', { weekday:'long' });
  const todayTasks = tasks.filter(t => t.day === today || t.day === 'Monday').slice(0,4);

  const streak = 7;
  const totalHours = (sessions.reduce((s,x)=>s+x.minutes,0) / 60).toFixed(1);
  const topicsCompleted = 18;
  const avgAccuracy = quizHistory.length > 0
    ? Math.round(quizHistory.reduce((s,q)=>s+q.accuracy,0) / quizHistory.length)
    : 84;

  const stats = [
    { icon:'flame', label:'Study Streak', value:`${streak} Days`, color:'from-orange-500 to-red-500', badge:'+1 today' },
    { icon:'clock', label:'Study Hours', value:`${totalHours}h`, color:'from-blue-500 to-cyan-500', badge:'This month' },
    { icon:'check-circle', label:'Topics Completed', value:topicsCompleted, color:'from-emerald-500 to-teal-500', badge:'+3 this week' },
    { icon:'target', label:'Quiz Accuracy', value:`${avgAccuracy}%`, color:'from-purple-500 to-pink-500', badge:'Keep it up!' },
  ];

  const toggleTask = (id) => {
    setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
  };

  return (
    <div className="space-y-6">
      <div>
        <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900">{greeting()}! 👋</h1>
        <p className="text-slate-600 mt-1">Ready to continue learning?</p>
      </div>

      {/* Stats */}
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        {stats.map(s => (
          <Card key={s.label} className="relative overflow-hidden">
            <div className={`w-10 h-10 rounded-xl bg-gradient-to-br ${s.color} flex items-center justify-center mb-3`}>
              <Icon name={s.icon} size={18} className="text-white" />
            </div>
            <div className="text-2xl font-extrabold text-slate-900">{s.value}</div>
            <div className="text-xs text-slate-500 mt-0.5">{s.label}</div>
            <Badge variant="success" className="mt-2 !text-[10px]">{s.badge}</Badge>
          </Card>
        ))}
      </div>

      <div className="grid lg:grid-cols-3 gap-6">
        {/* Continue Learning */}
        <div className="lg:col-span-2 space-y-6">
          <Card>
            <div className="flex items-center justify-between mb-4">
              <h2 className="font-semibold text-lg flex items-center gap-2"><Icon name="book-open" size={18} className="text-brand-600" /> Continue Learning</h2>
              <Button variant="ghost" size="sm" onClick={() => navigate('/progress')}>View All</Button>
            </div>
            <div className="grid sm:grid-cols-2 gap-3">
              {SUBJECTS.slice(0,4).map(s => (
                <div key={s.id} className="rounded-xl border border-slate-100 p-4 hover:border-brand-200 hover:shadow-sm transition-all group">
                  <div className="flex items-start gap-3 mb-3">
                    <div className={`w-10 h-10 rounded-lg bg-gradient-to-br ${s.color} flex items-center justify-center flex-shrink-0`}>
                      <Icon name={s.icon} size={18} className="text-white" />
                    </div>
                    <div className="min-w-0 flex-1">
                      <div className="font-semibold text-sm text-slate-800 truncate">{s.name}</div>
                      <div className="text-xs text-slate-500">Last: {s.lastStudied}</div>
                    </div>
                  </div>
                  <div className="flex items-center justify-between mb-1.5">
                    <span className="text-xs text-slate-500">Progress</span>
                    <span className="text-xs font-bold text-slate-800">{s.progress}%</span>
                  </div>
                  <ProgressBar value={s.progress} color={s.color.includes('blue')?'bg-blue-500':s.color.includes('purple')?'bg-purple-500':s.color.includes('emerald')?'bg-emerald-500':'bg-brand-500'} />
                  <Button size="sm" variant="outline" className="w-full mt-3" onClick={() => navigate('/tutor')} iconRight="arrow-right">Continue</Button>

              {exams.slice(0,3).map(e => {
                const days = daysBetween(e.date);

                  <div key={e.id} className="rounded-xl bg-gradient-to-br from-slate-50 to-white border border-slate-100 p-3.5">
                    <div className="flex items-center justify-between mb-1">
                      <div className="font-semibold text-sm text-slate-800 truncate">{e.subject}</div>
                      <Badge variant={days <= 7 ? 'danger' : days <= 14 ? 'warning' : 'default'}>{days}d</Badge>
                    </div>
                    <div className="text-xs text-slate-500 mb-2">{formatDate(e.date)} · {e.preparation}% prepared</div>
                    <ProgressBar value={e.preparation} color="bg-gradient-to-r from-brand-500 to-accent-500" />
                  </div>
                );
              })}
            </div>
          </Card>

          <PomodoroTimer />

          <Card>
            <h2 className="font-semibold text-lg flex items-center gap-2 mb-4"><Icon name="sparkles" size={18} className="text-accent-600" /> AI Recommendation</h2>
            <div className="rounded-xl bg-gradient-to-br from-accent-50 to-brand-50 p-4">
              <div className="flex items-center justify-between mb-2">
                <span className="font-semibold text-sm text-slate-800">Review Probability</span>
                <Badge variant="accent">Priority 90</Badge>
              </div>
              <p className="text-xs text-slate-600 leading-relaxed mb-3">Recommended because your quiz score for this topic is low and your exam is approaching.</p>
              <Button size="sm" className="w-full" onClick={() => navigate('/tutor')} icon="play">Start Session</Button>
            </div>
          </Card>
        </div>
      </div>
    </div>
  );
}

/* -------- AI Tutor -------- */
function AITutor() {
  const [mode, setMode] = useLocalStorage('studymate:tutor-mode', 'detailed');
  const [messages, setMessages] = useState([
    { id:'welcome', role:'assistant', content:"Hi! I'm your AI study partner. Ask me anything about your subjects — try **recursion**, **supervised learning**, or **normalization**.", timestamp:new Date().toISOString() },
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const scrollRef = useRef(null);

  const modes = [
    { id:'beginner', label:'Beginner Mode', icon:'smile', desc:'Simple language' },
    { id:'exam', label:'Exam Mode', icon:'graduation-cap', desc:'Concise & structured' },
    { id:'detailed', label:'Detailed Mode', icon:'book-open', desc:'Deep explanations' },
    { id:'revision', label:'Quick Revision', icon:'zap', desc:'Only key points' },
  ];

  const quickPrompts = [
    'Explain recursion simply',
    'What is supervised learning?',
    'Explain normalization',
    'Give me an example of polymorphism',
    'Explain this topic step-by-step',
    'Give me a real-world example',
    'Quiz me on this topic',
  ];

  useEffect(() => {
    scrollRef.current?.scrollTo({ top: scrollRef.current.scrollHeight, behavior:'smooth' });
  }, [messages]);

  const send = async (text) => {
    const q = text || input.trim();
    if (!q || loading) return;
    setInput('');
    const userMsg = { id:uid('u'), role:'user', content:q, timestamp:new Date().toISOString() };
    setMessages(m => [...m, userMsg]);
    setLoading(true);
    const answer = await aiService.askQuestion(q, mode);
    setMessages(m => [...m, { id:uid('a'), role:'assistant', content:answer, timestamp:new Date().toISOString() }]);
    setLoading(false);
  };

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-start justify-between gap-4">
        <div>
          <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 flex items-center gap-2"><Icon name="message-circle" size={28} className="text-brand-600" /> StudyMate AI Tutor</h1>
          <p className="text-slate-600 mt-1">Your personal AI study partner. Ask anything about your subjects.</p>
        </div>
      </div>

      {/* Learning Modes */}
      <Card padding="p-3">
        <div className="grid grid-cols-2 md:grid-cols-4 gap-2">
          {modes.map(m => (

/* -------- Notes -------- */
function Notes({ notes, setNotes, navigate }) {
  const toast = useToast();
  const [search, setSearch] = useState('');
  const [subjectFilter, setSubjectFilter] = useState('All');
  const [favOnly, setFavOnly] = useState(false);
  const [modal, setModal] = useState(null); // null | 'create' | note object
  const [form, setForm] = useState({ title:'', subject:'Python', content:'', tags:'' });

  const subjects = ['All', ...new Set(notes.map(n => n.subject))];

  const filtered = useMemo(() => notes.filter(n => {
    if (subjectFilter !== 'All' && n.subject !== subjectFilter) return false;
    if (favOnly && !n.favorite) return false;
    if (search) {
      const q = search.toLowerCase();
      return (n.title + n.content + n.subject + n.tags.join(' ')).toLowerCase().includes(q);
    }
    return true;
  }), [notes, search, subjectFilter, favOnly]);

  const openCreate = () => { setForm({ title:'', subject:'Python', content:'', tags:'' }); setModal('create'); };
  const openEdit = (note) => { setForm({ ...note, tags: note.tags.join(', ') }); setModal(note); };

  const save = () => {
    if (!form.title.trim() || !form.content.trim()) { toast('Please fill title and content', 'error'); return; }
    const tags = form.tags.split(',').map(t => t.trim()).filter(Boolean);
    if (modal === 'create') {
      const newNote = {
        id: uid('n'), title: form.title, subject: form.subject, content: form.content,
        tags, favorite:false, createdAt:new Date().toISOString(), updatedAt:new Date().toISOString(),
      };
      setNotes([newNote, ...notes]);
      toast('Note created', 'success');
    } else {
      setNotes(notes.map(n => n.id === modal.id ? { ...n, ...form, tags, updatedAt:new Date().toISOString() } : n));
      toast('Note updated', 'success');
    }
    setModal(null);
  };

  const del = (id) => {
    if (confirm('Delete this note?')) { setNotes(notes.filter(n => n.id !== id)); toast('Note deleted', 'success'); }
  };

  const toggleFav = (id) => setNotes(notes.map(n => n.id === id ? { ...n, favorite: !n.favorite } : n));

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 flex items-center gap-2"><Icon name="notebook-pen" size={26} className="text-brand-600" /> My Notes</h1>
          <p className="text-slate-600 mt-1">{notes.length} notes · {notes.filter(n=>n.favorite).length} favorites</p>
        </div>
        <Button icon="plus" onClick={openCreate}>Create New Note</Button>
      </div>

      <Card padding="p-4">
        <div className="flex flex-col sm:flex-row gap-3">
          <div className="flex-1 relative">
            <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search notes…" className="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-brand-500 outline-none text-sm" />
          </div>
          <select value={subjectFilter} onChange={e => setSubjectFilter(e.target.value)} className="px-3 py-2.5 rounded-xl border border-slate-200 bg-white text-sm">
            {subjects.map(s => <option key={s}>{s}</option>)}
          </select>
          <button onClick={() => setFavOnly(!favOnly)} className={`px-3.5 py-2.5 rounded-xl border text-sm font-medium flex items-center gap-2 ${favOnly?'bg-amber-50 border-amber-200 text-amber-700':'border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
            <Icon name="star" size={14} className={favOnly?'fill-amber-400 text-amber-400':''} /> Favorites
          </button>
        </div>
      </Card>

      {filtered.length === 0 ? (
        <Card><EmptyState icon="notebook" title="No notes found" description={search || subjectFilter !== 'All' || favOnly ? 'Try adjusting your filters.' : 'Create your first note to get started.'} action={<Button icon="plus" onClick={openCreate}>Create Note</Button>} /></Card>
      ) : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {filtered.map(n => (
            <Card key={n.id} className="flex flex-col hover:shadow-lg transition-shadow">
              <div className="flex items-start justify-between gap-2 mb-2">
                <Badge variant="brand">{n.subject}</Badge>
                <button onClick={() => toggleFav(n.id)} className="p-1 rounded hover:bg-slate-100">
                  <Icon name="star" size={15} className={n.favorite ? 'fill-amber-400 text-amber-400' : 'text-slate-400'} />
                </button>
              </div>
              <h3 className="font-semibold text-slate-900 mb-1.5 line-clamp-2">{n.title}</h3>
              <p className="text-sm text-slate-600 line-clamp-3 flex-1">{n.content}</p>
              <div className="flex flex-wrap gap-1 mt-3">
                {n.tags.slice(0,3).map(t => <span key={t} className="text-[10px] px-2 py-0.5 rounded-full bg-slate-100 text-slate-600">#{t}</span>)}
              </div>
              <div className="flex items-center justify-between mt-3 pt-3 border-t border-slate-100">
                <span className="text-[11px] text-slate-400">{formatDate(n.updatedAt)}</span>
                <div className="flex gap-1">
                  <button onClick={() => openEdit(n)} className="p-1.5 rounded hover:bg-slate-100 text-slate-500"><Icon name="pencil" size={14} /></button>
                  <button onClick={() => del(n.id)} className="p-1.5 rounded hover:bg-red-50 text-red-500"><Icon name="trash-2" size={14} /></button>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}

      <Modal open={!!modal} onClose={() => setModal(null)} title={modal === 'create' ? 'Create New Note' : 'Edit Note'}
        footer={<><Button variant="secondary" onClick={() => setModal(null)}>Cancel</Button><Button onClick={save} icon="check">Save Note</Button></>}>
        <div className="space-y-4">
          <Input label="Title" value={form.title} onChange={e => setForm({ ...form, title:e.target.value })} placeholder="e.g. Python List Comprehensions" />
          <Select label="Subject" value={form.subject} onChange={e => setForm({ ...form, subject:e.target.value })} options={SUBJECTS.map(s => s.name)} />
          <Textarea label="Content" value={form.content} onChange={e => setForm({ ...form, content:e.target.value })} placeholder="Write your note content…" rows={8} />
          <Input label="Tags (comma separated)" value={form.tags} onChange={e => setForm({ ...form, tags:e.target.value })} placeholder="python, basics" />
        </div>
      </Modal>
    </div>
  );
}

/* -------- Note Analyzer -------- */
function NoteAnalyzer({ navigate }) {
  const toast = useToast();
  const [text, setText] = useState('');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);

  const analyze = async () => {
    if (!text.trim()) { toast('Paste some study material first', 'error'); return; }
    setLoading(true);
    const res = await aiService.summarizeText(text, 'medium');
    // Derive extra analysis
    const sentences = text.split(/(?<=[.!?])\s+/);
    const questions = sentences.filter(s => /what|why|how|when|where|which|explain/i.test(s)).slice(0,5);
    setResult({
      ...res,
      topics: res.concepts.slice(0,4),
      questions: questions.length > 0 ? questions : [
        'What is the main idea of this material?',
        'Explain the key concepts in your own words.',
        'Give a real-world example of each concept.',
        'How do these concepts relate to each other?',
        'What are common misconceptions about this topic?',
      ],
    });
    setLoading(false);
    toast('Analysis complete', 'success');
  };

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 flex items-center gap-2"><Icon name="scan-text" size={26} className="text-brand-600" /> AI Note Analyzer</h1>
        <p className="text-slate-600 mt-1">Paste study material and let AI extract topics, concepts, definitions, and key questions.</p>

      <Card>
        <Textarea label="Study Material" value={text} onChange={e => setText(e.target.value)} rows={10} placeholder="Paste your notes, article, or textbook content here…" />

      {loading && (

            <Skeleton className="h-4 w-3/4" /><Skeleton className="h-4 w-full" /><Skeleton className="h-4 w-5/6" />
            <Skeleton className="h-4 w-2/3" /><Skeleton className="h-4 w-3/4" />
          </div>
        </Card>
      )}

      {result && (
        <div className="grid lg:grid-cols-3 gap-5">
          <div className="lg:col-span-2 space-y-5">
            <Card>
              <h3 className="font-semibold flex items-center gap-2 mb-3"><Icon name="file-minus" size={16} className="text-brand-600" /> Summary</h3>
              <Markdown text={result.summary} />
            </Card>
            <Card>

                {result.keyPoints.map((k,i) => (
                  <li key={i} className="flex gap-2 text-sm text-slate-700">
                    <Icon name="check-circle-2" size={15} className="text-emerald-500 flex-shrink-0 mt-0.5" />
                    <span>{k}</span>
                  </li>
                ))}
              </ul>
            </Card>
            <Card>
              <h3 className="font-semibold flex items-center gap-2 mb-3"><Icon name="book-open" size={16} className="text-brand-600" /> Definitions</h3>
              <div className="space-y-3">
                {result.definitions.map((d,i) => (
                  <div key={i} className="p-3 rounded-lg bg-slate-50 border border-slate-100">
                    <div className="font-semibold text-sm text-slate-800 mb-1">{d.term}</div>
                    <div className="text-xs text-slate-600">{d.definition}</div>
                  </div>
                ))}

            </Card>

              <h3 className="font-semibold flex items-center gap-2 mb-3"><Icon name="hash" size={16} className="text-brand-600" /> Main Topics</h3>
