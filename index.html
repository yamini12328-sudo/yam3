/* -------- Document Analyzer -------- */
function DocumentAnalyzer({ navigate }) {
  const toast = useToast();
  const [doc, setDoc] = useState(null);
  const [processing, setProcessing] = useState(false);
  const inputRef = useRef(null);

  const handleFile = async (file) => {
    if (!file) return;
    const ext = file.name.split('.').pop().toLowerCase();
    if (!['pdf','txt','docx','doc'].includes(ext)) {
      toast('Unsupported file. Use PDF, TXT, or DOCX.', 'error');
      return;
    }
    setProcessing(true);
    await new Promise(r => setTimeout(r, 1000));
    const fakePages = Math.max(1, Math.round(file.size / 30000));
    const topics = ['Introduction','Core Concepts','Methodology','Applications','Conclusion'].sort(() => Math.random() - 0.5).slice(0,4);
    setDoc({
      name: file.name,
      type: ext.toUpperCase(),
      size: file.size,
      pages: fakePages,
      readingTime: Math.max(2, Math.round(fakePages * 2.5)),
      topics,
    });
    setProcessing(false);
    toast('Document processed successfully', 'success');
  };

  const onDrop = (e) => { e.preventDefault(); handleFile(e.dataTransfer.files[0]); };
  const onDragOver = (e) => e.preventDefault();

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 flex items-center gap-2"><Icon name="file-text" size={26} className="text-brand-600" /> Document Analyzer</h1>
        <p className="text-slate-600 mt-1">Upload a PDF, TXT, or DOCX file and let AI extract structure and topics. (Demo mode)</p>
      </div>

      {!doc && !processing && (
        <Card>
          <div onDrop={onDrop} onDragOver={onDragOver} onClick={() => inputRef.current?.click()}
            className="border-2 border-dashed border-slate-200 rounded-2xl p-10 text-center cursor-pointer hover:border-brand-400 hover:bg-brand-50/30 transition">
            <input ref={inputRef} type="file" accept=".pdf,.txt,.docx,.doc" className="hidden" onChange={e => handleFile(e.target.files[0])} />
            <div className="w-16 h-16 rounded-2xl bg-gradient-to-br from-brand-500 to-accent-600 flex items-center justify-center mx-auto mb-4">
              <Icon name="upload-cloud" size={28} className="text-white" />
            </div>
            <h3 className="font-semibold text-lg text-slate-800 mb-1">Drag & drop your document</h3>
            <p className="text-sm text-slate-500 mb-4">or click to browse — supports PDF, TXT, DOCX</p>
            <Button icon="upload">Choose File</Button>
          </div>
        </Card>
      )}

      {processing && (
        <Card>
          <div className="flex items-center gap-3 mb-4">
            <div className="w-10 h-10 rounded-xl bg-brand-100 flex items-center justify-center"><Icon name="loader" size={20} className="text-brand-600 animate-spin" /></div>
            <div><div className="font-semibold">Processing document…</div><div className="text-xs text-slate-500">Extracting text, detecting topics</div></div>
          </div>
          <div className="space-y-2">
            <Skeleton className="h-3 w-3/4" /><Skeleton className="h-3 w-full" /><Skeleton className="h-3 w-5/6" />
          </div>
        </Card>
      )}

      {doc && !processing && (
        <div className="grid lg:grid-cols-3 gap-5">
          <Card className="lg:col-span-2">
            <div className="flex items-start gap-4 mb-5">
              <div className="w-14 h-14 rounded-xl bg-gradient-to-br from-red-500 to-orange-500 flex items-center justify-center flex-shrink-0">
                <Icon name="file-text" size={24} className="text-white" />
              </div>
              <div className="flex-1 min-w-0">
                <div className="font-semibold text-slate-900 truncate">{doc.name}</div>
                <div className="text-xs text-slate-500 mt-0.5">{doc.type} · {(doc.size/1024).toFixed(1)} KB</div>
              </div>
              <Button variant="ghost" size="sm" icon="x" onClick={() => setDoc(null)}>Remove</Button>
            </div>
            <div className="grid grid-cols-2 gap-3 mb-5">
              <div className="rounded-xl bg-slate-50 p-3">
                <div className="text-xs text-slate-500">Pages</div>
                <div className="text-xl font-bold text-slate-800">{doc.pages}</div>
              </div>
              <div className="rounded-xl bg-slate-50 p-3">
                <div className="text-xs text-slate-500">Reading time</div>
                <div className="text-xl font-bold text-slate-800">{doc.readingTime} min</div>
              </div>
            </div>
            <h3 className="font-semibold text-sm mb-2 flex items-center gap-2"><Icon name="hash" size={14} className="text-brand-600" /> Detected Topics</h3>
            <div className="flex flex-wrap gap-2">
              {doc.topics.map(t => <Badge key={t} variant="brand">{t}</Badge>)}
            </div>
          </Card>
          <Card>
            <h3 className="font-semibold text-sm mb-3">Actions</h3>
            <div className="space-y-2">
              <Button variant="secondary" className="w-full justify-start" icon="file-minus" onClick={() => navigate('/summarizer')}>Summarize Document</Button>
              <Button variant="secondary" className="w-full justify-start" icon="help-circle" onClick={() => navigate('/quiz')}>Generate Quiz</Button>
              <Button variant="secondary" className="w-full justify-start" icon="layers" onClick={() => navigate('/flashcards')}>Generate Flashcards</Button>
              <Button variant="secondary" className="w-full justify-start" icon="message-circle" onClick={() => navigate('/tutor')}>Ask Questions</Button>
            </div>
            <div className="mt-4 p-3 rounded-lg bg-amber-50 border border-amber-100">
              <p className="text-[11px] text-amber-800 leading-relaxed">Demo mode: file processing is simulated. Connect a real document parser and AI API for production.</p>
            </div>
          </Card>
        </div>
      )}
    </div>
  );
}

/* -------- Summarizer -------- */
function Summarizer({ notes, navigate }) {
  const toast = useToast();
  const [text, setText] = useState('');
  const [mode, setMode] = useState('medium');
  const [result, setResult] = useState(null);
  const [loading, setLoading] = useState(false);
  const [selectedNote, setSelectedNote] = useState('');

  const run = async () => {
    if (!text.trim()) { toast('Enter or select text to summarize', 'error'); return; }
    setLoading(true);
    const res = await aiService.summarizeText(text, mode);
    setResult(res);
    setLoading(false);
    toast('Summary generated', 'success');
  };

  const loadNote = (id) => {
    setSelectedNote(id);
    const n = notes.find(x => x.id === id);
    if (n) setText(`${n.title}\n\n${n.content}`);
  };

  const copy = () => {
    if (!result) return;
    navigator.clipboard.writeText(result.summary);
    toast('Copied to clipboard', 'success');
  };

  const modes = [
    { id:'short', label:'Short', desc:'2–3 sentences' },
    { id:'medium', label:'Medium', desc:'Balanced summary' },
    { id:'detailed', label:'Detailed', desc:'In-depth' },
    { id:'exam', label:'Exam Revision', desc:'Key points only' },
  ];

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 flex items-center gap-2"><Icon name="file-minus" size={26} className="text-brand-600" /> AI Summarizer</h1>
        <p className="text-slate-600 mt-1">Paste text, upload, or select a note to generate a smart summary.</p>
      </div>

      <div className="grid lg:grid-cols-3 gap-5">
        <div className="lg:col-span-2 space-y-5">
          <Card>
            <div className="flex flex-wrap gap-2 mb-4">
              {modes.map(m => (
                <button key={m.id} onClick={() => setMode(m.id)} className={`px-3 py-2 rounded-lg text-xs font-semibold border transition ${mode===m.id?'bg-brand-600 text-white border-brand-600':'border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
                  {m.label}
                </button>
              ))}
            </div>
            <Select label="Load from Notes (optional)" value={selectedNote} onChange={e => loadNote(e.target.value)} options={[{value:'',label:'— Select a note —'}, ...notes.map(n => ({value:n.id,label:`${n.title} (${n.subject})`}))]} />
            <div className="mt-3">
              <Textarea label="Text to summarize" value={text} onChange={e => setText(e.target.value)} rows={10} placeholder="Paste your study material here…" />
            </div>
            <div className="flex gap-2 mt-3">
              <Button icon="sparkles" onClick={run} disabled={loading}>{loading ? 'Summarizing…' : 'Generate Summary'}</Button>
              <Button variant="secondary" icon="x" onClick={() => { setText(''); setResult(null); setSelectedNote(''); }}>Clear</Button>
            </div>
          </Card>

          {loading && <Card><div className="space-y-3"><Skeleton className="h-4 w-3/4" /><Skeleton className="h-4 w-full" /><Skeleton className="h-4 w-5/6" /></div></Card>}

          {result && (
            <>
              <Card>
                <div className="flex items-center justify-between mb-3">
                  <h3 className="font-semibold flex items-center gap-2"><Icon name="file-minus" size={16} className="text-brand-600" /> Summary</h3>
                  <div className="flex gap-1">
                    <Button variant="ghost" size="sm" icon="copy" onClick={copy}>Copy</Button>
                    <Button variant="ghost" size="sm" icon="save" onClick={() => toast('Saved to your notes', 'success')}>Save</Button>
                  </div>
                </div>
                <Markdown text={result.summary} />
              </Card>
              <div className="grid sm:grid-cols-2 gap-5">
                <Card>
                  <h3 className="font-semibold text-sm mb-3 flex items-center gap-2"><Icon name="hash" size={14} className="text-brand-600" /> Important Concepts</h3>
                  <div className="flex flex-wrap gap-2">{result.concepts.map(c => <Badge key={c} variant="brand">{c}</Badge>)}</div>
                </Card>
                <Card>
                  <h3 className="font-semibold text-sm mb-3 flex items-center gap-2"><Icon name="list-checks" size={14} className="text-brand-600" /> Key Points</h3>
                  <ul className="space-y-1.5">{result.keyPoints.map((k,i) => <li key={i} className="text-xs text-slate-700 flex gap-2"><Icon name="check-circle-2" size={13} className="text-emerald-500 flex-shrink-0 mt-0.5" />{k}</li>)}</ul>
                </Card>
                <Card>
                  <h3 className="font-semibold text-sm mb-3 flex items-center gap-2"><Icon name="book-open" size={14} className="text-brand-600" /> Definitions</h3>
                  <div className="space-y-2">{result.definitions.map((d,i) => <div key={i}><div className="font-semibold text-xs text-slate-800">{d.term}</div><div className="text-xs text-slate-600">{d.definition}</div></div>)}</div>
                </Card>
                <Card>
                  <h3 className="font-semibold text-sm mb-3 flex items-center gap-2"><Icon name="lightbulb" size={14} className="text-brand-600" /> Examples</h3>
                  <ul className="space-y-1.5">{result.examples.map((e,i) => <li key={i} className="text-xs text-slate-700">{e}</li>)}</ul>
                </Card>
              </div>
            </>
          )}
        </div>

        <div className="space-y-5">
          <Card>
            <h3 className="font-semibold text-sm mb-3">Quick Actions</h3>
            <div className="space-y-2">
              <Button variant="secondary" className="w-full" icon="help-circle" onClick={() => navigate('/quiz')}>Generate Quiz</Button>
              <Button variant="secondary" className="w-full" icon="layers" onClick={() => navigate('/flashcards')}>Generate Flashcards</Button>
              <Button variant="secondary" className="w-full" icon="notebook-pen" onClick={() => navigate('/notes')}>Save to Notes</Button>
            </div>
          </Card>
          <Card className="!bg-brand-50 !border-brand-100">
            <div className="flex gap-2">
              <Icon name="info" size={16} className="text-brand-600 flex-shrink-0 mt-0.5" />
              <p className="text-xs text-brand-900 leading-relaxed">Summaries are AI-generated. Always review key facts with your original material.</p>
            </div>
          </Card>
        </div>
      </div>
    </div>
  );
}

/* -------- Quiz Generator -------- */
function QuizGenerator({ quizHistory, setQuizHistory }) {
  const toast = useToast();
  const [stage, setStage] = useState('setup'); // setup | quiz | result
  const [config, setConfig] = useState({ subject:'Python', topic:'', difficulty:'Medium', count:5, types:['mcq','tf','fill'] });
  const [questions, setQuestions] = useState([]);
  const [current, setCurrent] = useState(0);
  const [answers, setAnswers] = useState({});
  const [loading, setLoading] = useState(false);
  const [startTime, setStartTime] = useState(0);
  const [elapsed, setElapsed] = useState(0);
  const [timerOn, setTimerOn] = useState(false);

  useEffect(() => {
    if (stage !== 'quiz' || !timerOn) return;
    const t = setInterval(() => setElapsed(Math.floor((Date.now() - startTime) / 1000)), 1000);
    return () => clearInterval(t);
  }, [stage, timerOn, startTime]);

  const start = async () => {
    setLoading(true);
    const qs = await aiService.generateQuiz({ ...config, count: config.count });
    setQuestions(qs);
    setAnswers({}); setCurrent(0); setStage('quiz'); setStartTime(Date.now()); setElapsed(0);
    setLoading(false);
    toast(`Quiz started — ${qs.length} questions`, 'success');
  };

  const selectAnswer = (qid, val) => setAnswers(a => ({ ...a, [qid]: val }));

  const submit = () => {
    const correct = questions.filter(q => answers[q.id] === q.correctAnswer).length;
    const total = questions.length;
    const accuracy = total > 0 ? Math.round((correct / total) * 100) : 0;
    const attempt = {
      id: uid('q'), subject: config.subject, topic: config.topic || 'Mixed',
      difficulty: config.difficulty, totalQuestions: total, correctCount: correct,
      accuracy, timeTakenSec: elapsed, date: new Date().toISOString(),
      questions, userAnswers: answers,
    };
    setQuizHistory([attempt, ...quizHistory]);
    setStage('result');
    toast(`Quiz complete — ${correct}/${total}`, 'success');
  };

  const restart = () => { setStage('setup'); setQuestions([]); setAnswers({}); setCurrent(0); };

  if (stage === 'setup') {
    return (
      <div className="space-y-5">
        <div>
          <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 flex items-center gap-2"><Icon name="help-circle" size={26} className="text-brand-600" /> Quiz Generator</h1>
          <p className="text-slate-600 mt-1">AI generates realistic questions based on your subject and difficulty.</p>
        </div>
        <div className="grid lg:grid-cols-3 gap-5">
          <Card className="lg:col-span-2">
            <div className="grid sm:grid-cols-2 gap-4">
              <Select label="Subject" value={config.subject} onChange={e => setConfig({ ...config, subject:e.target.value })} options={['Any', ...SUBJECTS.map(s => s.name)]} />
              <Input label="Topic (optional)" value={config.topic} onChange={e => setConfig({ ...config, topic:e.target.value })} placeholder="e.g. Recursion" />
              <Select label="Difficulty" value={config.difficulty} onChange={e => setConfig({ ...config, difficulty:e.target.value })} options={['Easy','Medium','Hard']} />
              <Input label="Number of questions" type="number" min="3" max="15" value={config.count} onChange={e => setConfig({ ...config, count: Math.min(15, Math.max(3, parseInt(e.target.value)||5)) })} />
            </div>
            <div className="mt-4">
              <div className="text-sm font-medium text-slate-700 mb-2">Question Types</div>
              <div className="flex flex-wrap gap-2">
                {[
                  { id:'mcq', label:'Multiple Choice' },
                  { id:'tf', label:'True / False' },
                  { id:'fill', label:'Fill in the Blank' },
                ].map(t => {
                  const active = config.types.includes(t.id);
                  return (
                    <button key={t.id} onClick={() => setConfig(c => ({ ...c, types: active ? c.types.filter(x => x !== t.id) : [...c.types, t.id] }))}
                      className={`px-3 py-2 rounded-lg text-xs font-semibold border transition ${active?'bg-brand-600 text-white border-brand-600':'border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
                      {t.label}
                    </button>
                  );
                })}
              </div>
            </div>
            <div className="mt-5 flex items-center gap-3">
              <Button icon="sparkles" onClick={start} disabled={loading || config.types.length === 0}>{loading ? 'Generating…' : 'Generate Quiz'}</Button>
              <label className="flex items-center gap-2 text-sm text-slate-600">
                <input type="checkbox" checked={timerOn} onChange={e => setTimerOn(e.target.checked)} className="rounded" /> Enable timer
              </label>
            </div>
          </Card>
          <Card>
            <h3 className="font-semibold text-sm mb-3 flex items-center gap-2"><Icon name="history" size={16} className="text-brand-600" /> Recent Quizzes</h3>
            {quizHistory.length === 0
              ? <p className="text-xs text-slate-500">No quizzes yet. Generate your first one!</p>
              : quizHistory.slice(0,5).map(q => (
                <div key={q.id} className="py-2 border-b border-slate-100 last:border-0">
                  <div className="flex items-center justify-between">
                    <span className="text-sm font-medium text-slate-700 truncate">{q.subject}</span>
                    <Badge variant={q.accuracy >= 70 ? 'success' : q.accuracy >= 50 ? 'warning' : 'danger'}>{q.accuracy}%</Badge>
                  </div>
                  <div className="text-[11px] text-slate-500">{q.correctCount}/{q.totalQuestions} · {formatDate(q.date)}</div>
                </div>
              ))
            }
          </Card>
        </div>
      </div>
    );
  }

  if (stage === 'quiz') {
    const q = questions[current];
    const answered = Object.keys(answers).length;
    const progress = ((current + 1) / questions.length) * 100;
    return (
      <div className="space-y-5 max-w-3xl mx-auto">
        <div className="flex items-center justify-between">
          <div className="text-sm font-medium text-slate-600">Question {current + 1} of {questions.length}</div>
          {timerOn && <div className="flex items-center gap-1.5 text-sm font-mono font-semibold text-slate-700"><Icon name="timer" size={14} /> {pad(Math.floor(elapsed/60))}:{pad(elapsed%60)}</div>}
        </div>
        <ProgressBar value={progress} />
        <Card>
          <div className="flex items-center gap-2 mb-3">
            <Badge variant="brand">{q.subject}</Badge>
            <Badge variant={q.difficulty==='Easy'?'success':q.difficulty==='Medium'?'warning':'danger'}>{q.difficulty}</Badge>
            <Badge>{q.type === 'mcq' ? 'Multiple Choice' : q.type === 'tf' ? 'True/False' : 'Fill in the Blank'}</Badge>
          </div>
          <h3 className="text-lg font-semibold text-slate-900 mb-4">{q.question}</h3>
          <div className="space-y-2">
            {q.options.map(opt => {
              const sel = answers[q.id] === opt;
              return (
                <button key={opt} onClick={() => selectAnswer(q.id, opt)}
                  className={`w-full text-left px-4 py-3 rounded-xl border-2 transition-all text-sm font-medium ${sel?'border-brand-500 bg-brand-50 text-brand-800':'border-slate-200 hover:border-brand-300 hover:bg-slate-50 text-slate-700'}`}>
                  <div className="flex items-center gap-3">
                    <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center flex-shrink-0 ${sel?'border-brand-500 bg-brand-500':'border-slate-300'}`}>
                      {sel && <Icon name="check" size={11} className="text-white" strokeWidth={3} />}
                    </div>
                    {opt}
                  </div>
                </button>
              );
            })}
          </div>
        </Card>
        <div className="flex items-center justify-between gap-3">
          <Button variant="secondary" icon="arrow-left" disabled={current === 0} onClick={() => setCurrent(c => c - 1)}>Previous</Button>
          <div className="text-xs text-slate-500">{answered}/{questions.length} answered</div>
          {current < questions.length - 1
            ? <Button iconRight="arrow-right" onClick={() => setCurrent(c => c + 1)}>Next</Button>
            : <Button icon="check" variant="primary" onClick={submit}>Submit Quiz</Button>}
        </div>
      </div>
    );
  }

  // Result
  const correct = questions.filter(q => answers[q.id] === q.correctAnswer).length;
  const total = questions.length;
  const accuracy = Math.round((correct / total) * 100);
  return (
    <div className="space-y-5 max-w-3xl mx-auto">
      <Card className="text-center">
        <div className={`w-20 h-20 rounded-full mx-auto mb-4 flex items-center justify-center ${accuracy>=70?'bg-emerald-100':'bg-amber-100'}`}>
          <Icon name={accuracy>=70?'trophy':'target'} size={36} className={accuracy>=70?'text-emerald-600':'text-amber-600'} />
        </div>
        <h1 className="text-3xl font-extrabold text-slate-900 mb-1">Quiz Result</h1>
        <p className="text-slate-600 mb-6">{config.subject} · {config.topic || 'Mixed Topics'}</p>
        <div className="grid grid-cols-3 gap-4">
          <div className="rounded-xl bg-slate-50 p-4">
            <div className="text-3xl font-extrabold text-slate-900">{correct}/{total}</div>
            <div className="text-xs text-slate-500 mt-1">Score</div>
          </div>
          <div className="rounded-xl bg-slate-50 p-4">
            <div className={`text-3xl font-extrabold ${accuracy>=70?'text-emerald-600':accuracy>=50?'text-amber-600':'text-red-500'}`}>{accuracy}%</div>
            <div className="text-xs text-slate-500 mt-1">Accuracy</div>
          </div>
          <div className="rounded-xl bg-slate-50 p-4">
            <div className="text-3xl font-extrabold text-slate-900">{pad(Math.floor(elapsed/60))}:{pad(elapsed%60)}</div>
            <div className="text-xs text-slate-500 mt-1">Time</div>
          </div>
        </div>
        <div className="flex flex-wrap justify-center gap-2 mt-6">
          <Button icon="rotate-ccw" onClick={restart}>Try Again</Button>
          <Button variant="secondary" icon="list" onClick={() => setStage('review')}>Review Answers</Button>
          <Button variant="outline" icon="brain" onClick={restart}>Study Weak Topics</Button>
        </div>
      </Card>

      <Card>
        <h3 className="font-semibold text-lg mb-4">Review Answers</h3>
        <div className="space-y-4">
          {questions.map((q, i) => {
            const userAns = answers[q.id];
            const isCorrect = userAns === q.correctAnswer;
            return (
              <div key={q.id} className={`p-4 rounded-xl border-2 ${isCorrect?'border-emerald-200 bg-emerald-50/50':'border-red-200 bg-red-50/50'}`}>
                <div className="flex items-start gap-3 mb-2">
                  <div className={`w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 ${isCorrect?'bg-emerald-500':'bg-red-500'}`}>
                    <Icon name={isCorrect?'check':'x'} size={12} className="text-white" strokeWidth={3} />
                  </div>
                  <div className="flex-1">
                    <div className="font-semibold text-sm text-slate-800">Q{i+1}. {q.question}</div>
                  </div>
                </div>
                <div className="pl-9 space-y-1.5 text-sm">
                  <div><span className="text-slate-500">Your answer:</span> <span className={isCorrect?'text-emerald-700 font-medium':'text-red-600 font-medium'}>{userAns || 'Not answered'}</span></div>
                  {!isCorrect && <div><span className="text-slate-500">Correct:</span> <span className="text-emerald-700 font-medium">{q.correctAnswer}</span></div>}
                  <div className="text-xs text-slate-600 bg-white rounded-lg p-2.5 mt-2 border border-slate-100"><strong>Explanation:</strong> {q.explanation}</div>
                </div>
              </div>
            );
          })}
        </div>
      </Card>
    </div>
  );
}

/* -------- Flashcards -------- */
function Flashcards({ flashcardSets, setFlashcardSets }) {
  const toast = useToast();
  const [activeSet, setActiveSet] = useState(null);
  const [current, setCurrent] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [modal, setModal] = useState(false);
  const [genConfig, setGenConfig] = useState({ subject:'Machine Learning', topic:'', count:10 });
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    if (flashcardSets.length === 0) {
      setFlashcardSets([{ id:'default', name:'Demo Deck', subject:'Machine Learning', cards: DEMO_FLASHCARDS, createdAt:new Date().toISOString() }]);
    }
  }, []); // eslint-disable-line

  const generate = async () => {
    setLoading(true);
    const cards = await aiService.generateFlashcards(genConfig);
    const newSet = { id: uid('set'), name: `${genConfig.subject}${genConfig.topic?` — ${genConfig.topic}`:''}`, subject: genConfig.subject, cards, createdAt:new Date().toISOString() };
    setFlashcardSets([newSet, ...flashcardSets]);
    setModal(false); setActiveSet(newSet); setCurrent(0); setFlipped(false);
    setLoading(false);
    toast(`Generated ${cards.length} flashcards`, 'success');
  };

  const mark = (status) => {
    if (!activeSet) return;
    const updated = { ...activeSet, cards: activeSet.cards.map((c, i) => i === current ? { ...c, status } : c) };
    setActiveSet(updated);
    setFlashcardSets(flashcardSets.map(s => s.id === updated.id ? updated : s));
    if (current < activeSet.cards.length - 1) { setCurrent(current + 1); setFlipped(false); }
    else toast('Deck complete! Great work 🎉', 'success');
  };

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 flex items-center gap-2"><Icon name="layers" size={26} className="text-brand-600" /> Flashcards</h1>
          <p className="text-slate-600 mt-1">Active recall with flip, mark known, or review later.</p>
        </div>
        <Button icon="sparkles" onClick={() => setModal(true)}>Generate Flashcards with AI</Button>
      </div>

      {!activeSet ? (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {flashcardSets.map(s => {
            const known = s.cards.filter(c => c.status === 'known').length;
            return (
              <Card key={s.id} className="hover:shadow-lg transition">
                <div className="flex items-center justify-between mb-3">
                  <Badge variant="brand">{s.subject}</Badge>
                  <span className="text-xs text-slate-500">{s.cards.length} cards</span>
                </div>
                <h3 className="font-semibold text-slate-900 mb-1">{s.name}</h3>
                <div className="text-xs text-slate-500 mb-3">{known} mastered · {formatDate(s.createdAt)}</div>
                <ProgressBar value={(known/s.cards.length)*100} color="bg-emerald-500" className="mb-3" />
                <Button size="sm" className="w-full" onClick={() => { setActiveSet(s); setCurrent(0); setFlipped(false); }} icon="play">Study Deck</Button>
              </Card>
            );
          })}
        </div>
      ) : (
        <div className="max-w-2xl mx-auto space-y-4">
          <div className="flex items-center justify-between">
            <Button variant="ghost" icon="arrow-left" onClick={() => setActiveSet(null)}>Back to decks</Button>
            <div className="text-sm text-slate-600">Card <span className="font-bold text-slate-800">{current+1}</span> of {activeSet.cards.length}</div>
          </div>
          <ProgressBar value={((current+1)/activeSet.cards.length)*100} />

          <div className="relative h-72 sm:h-80 cursor-pointer" onClick={() => setFlipped(f => !f)} style={{ perspective:'1200px' }}>
            <div className="absolute inset-0 transition-transform duration-500" style={{ transformStyle:'preserve-3d', transform: flipped ? 'rotateY(180deg)' : '' }}>
              <div className="absolute inset-0 rounded-2xl bg-white shadow-card border border-slate-100 p-8 flex flex-col items-center justify-center text-center" style={{ backfaceVisibility:'hidden' }}>
                <Badge variant="brand" className="mb-4">Front</Badge>
                <h3 className="text-xl sm:text-2xl font-bold text-slate-900 leading-snug">{activeSet.cards[current].front}</h3>
                <p className="text-xs text-slate-400 mt-6 flex items-center gap-1.5"><Icon name="mouse-pointer-click" size={12} /> Click card to flip</p>
              </div>
              <div className="absolute inset-0 rounded-2xl bg-gradient-to-br from-brand-600 to-accent-700 shadow-card p-8 flex flex-col items-center justify-center text-center" style={{ backfaceVisibility:'hidden', transform:'rotateY(180deg)' }}>
                <Badge className="!bg-white/20 !text-white mb-4">Back</Badge>
                <p className="text-base sm:text-lg text-white leading-relaxed">{activeSet.cards[current].back}</p>
              </div>
            </div>
          </div>

          <div className="flex items-center justify-between gap-2">
            <Button variant="secondary" icon="arrow-left" disabled={current === 0} onClick={() => { setCurrent(current-1); setFlipped(false); }}>Previous</Button>
            <div className="flex gap-2">
              <Button variant="danger" icon="rotate-ccw" onClick={() => mark('review')}>Need Review</Button>
              <Button className="!bg-emerald-600 hover:!bg-emerald-700" icon="check" onClick={() => mark('known')}>Know</Button>
            </div>
            <Button variant="secondary" iconRight="arrow-right" disabled={current === activeSet.cards.length-1} onClick={() => { setCurrent(current+1); setFlipped(false); }}>Next</Button>
          </div>
        </div>
      )}

      <Modal open={modal} onClose={() => setModal(false)} title="Generate Flashcards with AI"
        footer={<><Button variant="secondary" onClick={() => setModal(false)}>Cancel</Button><Button icon="sparkles" onClick={generate} disabled={loading}>{loading?'Generating…':'Generate'}</Button></>}>
        <div className="space-y-4">
          <Select label="Subject" value={genConfig.subject} onChange={e => setGenConfig({ ...genConfig, subject:e.target.value })} options={['Any', ...SUBJECTS.map(s => s.name)]} />
          <Input label="Topic (optional)" value={genConfig.topic} onChange={e => setGenConfig({ ...genConfig, topic:e.target.value })} placeholder="e.g. Neural Networks" />
          <Input label="Number of cards" type="number" min="3" max="20" value={genConfig.count} onChange={e => setGenConfig({ ...genConfig, count: Math.min(20, Math.max(3, parseInt(e.target.value)||10)) })} />
        </div>
      </Modal>
    </div>
  );
}

/* -------- Study Planner -------- */
function StudyPlanner({ tasks, setTasks, exams }) {
  const toast = useToast();
  const days = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const [modal, setModal] = useState(null);
  const [form, setForm] = useState({ day:'Monday', startTime:'18:00', endTime:'19:00', subject:'Python', topic:'', priority:'Medium' });
  const [genModal, setGenModal] = useState(false);
  const [genForm, setGenForm] = useState({ subjects:['Machine Learning','SQL'], hoursPerDay:2 });

  const openCreate = () => { setForm({ day:'Monday', startTime:'18:00', endTime:'19:00', subject:'Python', topic:'', priority:'Medium' }); setModal('create'); };
  const openEdit = (t) => { setForm(t); setModal(t); };

  const save = () => {
    if (!form.topic.trim()) { toast('Enter a topic', 'error'); return; }
    if (modal === 'create') {
      setTasks([...tasks, { ...form, id:uid('task'), completed:false }]);
      toast('Task added', 'success');
    } else {
      setTasks(tasks.map(t => t.id === modal.id ? { ...t, ...form } : t));
      toast('Task updated', 'success');
    }
    setModal(null);
  };

  const del = (id) => { if (confirm('Delete task?')) { setTasks(tasks.filter(t => t.id !== id)); toast('Task deleted', 'success'); } };
  const toggle = (id) => setTasks(tasks.map(t => t.id === id ? { ...t, completed: !t.completed } : t));

  const generate = async () => {
    const newTasks = await aiService.generateStudyPlan({ subjects: genForm.subjects, hoursPerDay: genForm.hoursPerDay });
    setTasks([...newTasks, ...tasks]);
    setGenModal(false);
    toast(`Generated ${newTasks.length} study sessions`, 'success');
  };

  const priorityColor = { High:'danger', Medium:'warning', Low:'default' };

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 flex items-center gap-2"><Icon name="calendar-days" size={26} className="text-brand-600" /> Study Planner</h1>
          <p className="text-slate-600 mt-1">{tasks.filter(t=>!t.completed).length} pending · {tasks.filter(t=>t.completed).length} completed</p>
        </div>
        <div className="flex gap-2">
          <Button variant="secondary" icon="sparkles" onClick={() => setGenModal(true)}>Generate Plan</Button>
          <Button icon="plus" onClick={openCreate}>Add Task</Button>
        </div>
      </div>

      {exams.length > 0 && (
        <Card className="!bg-gradient-to-r !from-brand-50 !to-accent-50 !border-brand-100">
          <div className="flex items-center gap-3">
            <Icon name="timer" size={20} className="text-brand-600" />
            <div className="text-sm text-slate-700">
              Next exam: <strong>{exams[0].subject}</strong> in <strong>{daysBetween(exams[0].date)} days</strong> — {exams[0].preparation}% prepared
            </div>
          </div>
        </Card>
      )}

      <div className="grid md:grid-cols-2 xl:grid-cols-3 gap-4">
        {days.map(day => {
          const dayTasks = tasks.filter(t => t.day === day);
          return (
            <Card key={day}>
              <div className="flex items-center justify-between mb-3">
                <h3 className="font-semibold text-slate-800">{day}</h3>
                <Badge>{dayTasks.length} tasks</Badge>
              </div>
              {dayTasks.length === 0 ? (
                <p className="text-xs text-slate-400 py-3 text-center">No tasks scheduled</p>
              ) : (
                <div className="space-y-2">
                  {dayTasks.map(t => (
                    <div key={t.id} className={`p-2.5 rounded-lg border transition group ${t.completed?'bg-slate-50 border-slate-100 opacity-70':'bg-white border-slate-200 hover:border-brand-300'}`}>
                      <div className="flex items-center gap-2">
                        <button onClick={() => toggle(t.id)} className={`w-4 h-4 rounded border-2 flex items-center justify-center flex-shrink-0 ${t.completed?'bg-emerald-500 border-emerald-500':'border-slate-300'}`}>
                          {t.completed && <Icon name="check" size={10} className="text-white" strokeWidth={3} />}
                        </button>
                        <div className="flex-1 min-w-0">
                          <div className={`text-xs font-semibold truncate ${t.completed?'line-through text-slate-400':'text-slate-800'}`}>{t.subject}</div>
                          <div className="text-[10px] text-slate-500 truncate">{t.startTime}–{t.endTime} · {t.topic}</div>
                        </div>
                        <Badge variant={priorityColor[t.priority]} className="!text-[9px] !px-1.5">{t.priority}</Badge>
                      </div>
                      <div className="flex justify-end gap-1 mt-1.5 opacity-0 group-hover:opacity-100 transition">
                        <button onClick={() => openEdit(t)} className="p-1 rounded hover:bg-slate-100 text-slate-500"><Icon name="pencil" size={11} /></button>
                        <button onClick={() => del(t.id)} className="p-1 rounded hover:bg-red-50 text-red-500"><Icon name="trash-2" size={11} /></button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </Card>
          );
        })}
      </div>

      <Modal open={!!modal} onClose={() => setModal(null)} title={modal === 'create' ? 'Add Study Task' : 'Edit Task'}
        footer={<><Button variant="secondary" onClick={() => setModal(null)}>Cancel</Button><Button icon="check" onClick={save}>Save</Button></>}>
        <div className="space-y-4">
          <Select label="Day" value={form.day} onChange={e => setForm({ ...form, day:e.target.value })} options={days} />
          <div className="grid grid-cols-2 gap-3">
            <Input label="Start" type="time" value={form.startTime} onChange={e => setForm({ ...form, startTime:e.target.value })} />
            <Input label="End" type="time" value={form.endTime} onChange={e => setForm({ ...form, endTime:e.target.value })} />
          </div>
          <Select label="Subject" value={form.subject} onChange={e => setForm({ ...form, subject:e.target.value })} options={SUBJECTS.map(s => s.name)} />
          <Input label="Topic" value={form.topic} onChange={e => setForm({ ...form, topic:e.target.value })} placeholder="e.g. Recursion Practice" />
          <Select label="Priority" value={form.priority} onChange={e => setForm({ ...form, priority:e.target.value })} options={['High','Medium','Low']} />
        </div>
      </Modal>

      <Modal open={genModal} onClose={() => setGenModal(false)} title="Generate Study Plan with AI"
        footer={<><Button variant="secondary" onClick={() => setGenModal(false)}>Cancel</Button><Button icon="sparkles" onClick={generate}>Generate</Button></>}>
        <div className="space-y-4">
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-1.5">Subjects</label>
            <div className="flex flex-wrap gap-2">
              {SUBJECTS.map(s => {
                const active = genForm.subjects.includes(s.name);
                return (
                  <button key={s.id} onClick={() => setGenForm(f => ({ ...f, subjects: active ? f.subjects.filter(x => x !== s.name) : [...f.subjects, s.name] }))}
                    className={`px-3 py-1.5 rounded-lg text-xs font-medium border transition ${active?'bg-brand-600 text-white border-brand-600':'border-slate-200 text-slate-600 hover:bg-slate-50'}`}>
                    {s.name}
                  </button>
                );
              })}
            </div>
          </div>
          <Input label="Hours per day" type="number" min="1" max="8" value={genForm.hoursPerDay} onChange={e => setGenForm({ ...genForm, hoursPerDay: Math.min(8, Math.max(1, parseInt(e.target.value)||2)) })} />
        </div>
      </Modal>
    </div>
  );
}

/* -------- Exam Countdown -------- */
function ExamCountdown({ exams, setExams }) {
  const toast = useToast();
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({ name:'', subject:'Python', date:'', preparation:0, priority:'Medium' });
  const [, setTick] = useState(0);

  useEffect(() => {
    const t = setInterval(() => setTick(x => x+1), 1000);
    return () => clearInterval(t);
  }, []);

  const save = () => {
    if (!form.name.trim() || !form.date) { toast('Enter name and date', 'error'); return; }
    setExams([...exams, { ...form, id: uid('e') }]);
    setModal(false);
    toast('Exam added', 'success');
  };

  const del = (id) => { if (confirm('Delete exam?')) { setExams(exams.filter(e => e.id !== id)); toast('Exam deleted', 'success'); } };

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 flex items-center gap-2"><Icon name="timer" size={26} className="text-brand-600" /> Exam Countdown</h1>
          <p className="text-slate-600 mt-1">Track exam dates and preparation progress.</p>
        </div>
        <Button icon="plus" onClick={() => setModal(true)}>Add Exam</Button>
      </div>

      {exams.length === 0 ? (
        <Card><EmptyState icon="calendar-plus" title="No exams added" description="Add your upcoming exams to see countdowns and preparation progress." action={<Button icon="plus" onClick={() => setModal(true)}>Add Exam</Button>} /></Card>
      ) : (
        <div className="grid sm:grid-cols-2 gap-5">
          {exams.map(e => {
            const c = examCountdown(e.date);
            const soon = c.days <= 7;
            return (
              <Card key={e.id} className={`relative overflow-hidden ${soon?'!border-red-200':''}`}>
                <div className={`absolute top-0 left-0 w-1 h-full ${soon?'bg-red-500':c.days<=14?'bg-amber-500':'bg-brand-500'}`} />
                <div className="flex items-start justify-between mb-3">
                  <div className="flex-1">
                    <div className="flex items-center gap-2 mb-1">
                      <Badge variant="brand">{e.subject}</Badge>
                      <Badge variant={e.priority==='High'?'danger':e.priority==='Medium'?'warning':'default'}>{e.priority}</Badge>
                    </div>
                    <h3 className="font-semibold text-slate-900">{e.name}</h3>
                    <div className="text-xs text-slate-500 mt-0.5">{formatDate(e.date)}</div>
                  </div>
                  <button onClick={() => del(e.id)} className="p-1.5 rounded hover:bg-red-50 text-red-500"><Icon name="trash-2" size={14} /></button>
                </div>

                <div className="grid grid-cols-4 gap-2 my-4">
                  {[{v:c.days,l:'Days'},{v:c.hours,l:'Hours'},{v:c.minutes,l:'Min'},{v:c.seconds,l:'Sec'}].map(x => (
                    <div key={x.l} className="rounded-lg bg-slate-50 py-2 text-center">
                      <div className="font-mono font-bold text-lg text-slate-800">{pad(x.v)}</div>
                      <div className="text-[10px] text-slate-500">{x.l}</div>
                    </div>
                  ))}
                </div>

                <div>
                  <div className="flex justify-between text-xs mb-1.5">
                    <span className="text-slate-500">Preparation</span>
                    <span className="font-bold text-slate-800">{e.preparation}%</span>
                  </div>
                  <ProgressBar value={e.preparation} color={e.preparation>=70?'bg-emerald-500':e.preparation>=40?'bg-amber-500':'bg-red-500'} />
                </div>
              </Card>
            );
          })}
        </div>
      )}

      <Modal open={modal} onClose={() => setModal(false)} title="Add Exam"
        footer={<><Button variant="secondary" onClick={() => setModal(false)}>Cancel</Button><Button icon="check" onClick={save}>Add Exam</Button></>}>
        <div className="space-y-4">
          <Input label="Exam name" value={form.name} onChange={e => setForm({ ...form, name:e.target.value })} placeholder="e.g. Machine Learning Final" />
          <Select label="Subject" value={form.subject} onChange={e => setForm({ ...form, subject:e.target.value })} options={SUBJECTS.map(s => s.name)} />
          <Input label="Exam date" type="date" value={form.date} onChange={e => setForm({ ...form, date:e.target.value })} />
          <Input label="Preparation %" type="number" min="0" max="100" value={form.preparation} onChange={e => setForm({ ...form, preparation: Math.min(100, Math.max(0, parseInt(e.target.value)||0)) })} />
          <Select label="Priority" value={form.priority} onChange={e => setForm({ ...form, priority:e.target.value })} options={['High','Medium','Low']} />
        </div>
      </Modal>
    </div>
  );
}

/* -------- Exam Answer Generator -------- */
function ExamAnswerGenerator() {
  const toast = useToast();
  const [topic, setTopic] = useState('');
  const [marks, setMarks] = useState('5');
  const [simple, setSimple] = useState(false);
  const [answer, setAnswer] = useState(null);
  const [loading, setLoading] = useState(false);

  const generate = async () => {
    if (!topic.trim()) { toast('Enter a topic', 'error'); return; }
    setLoading(true);
    const res = await aiService.generateExamAnswer({ topic, marks, simple });
    setAnswer(res);
    setLoading(false);
    toast('Answer generated', 'success');
  };

  const copy = () => {
    if (!answer) return;
    const full = `Definition: ${answer.definition}\n\nIntroduction:\n${answer.introduction}\n\nMain Points:\n${answer.mainPoints.map(p=>`• ${p}`).join('\n')}\n\nExplanation:\n${answer.explanation}\n\nExamples:\n${answer.examples}\n\nConclusion:\n${answer.conclusion}`;
    navigator.clipboard.writeText(full);
    toast('Answer copied', 'success');
  };

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 flex items-center gap-2"><Icon name="graduation-cap" size={26} className="text-brand-600" /> Exam Answer Generator</h1>
        <p className="text-slate-600 mt-1">Generate structured exam answers with proper mark weightage.</p>
      </div>

      <Card>
        <div className="grid sm:grid-cols-2 gap-4">
          <Input label="Topic" value={topic} onChange={e => setTopic(e.target.value)} placeholder="e.g. Explain Cloud Computing" />
          <Select label="Answer Length" value={marks} onChange={e => setMarks(e.target.value)} options={['2','5','10','12','15'].map(m => ({ value:m, label:`${m} Marks` }))} />
        </div>
        <label className="flex items-center gap-2 text-sm text-slate-600 mt-4">
          <input type="checkbox" checked={simple} onChange={e => setSimple(e.target.checked)} className="rounded" /> Simple Language
        </label>
        <Button icon="sparkles" onClick={generate} disabled={loading} className="mt-4">{loading?'Generating…':'Generate Answer'}</Button>
      </Card>

      {loading && <Card><div className="space-y-3"><Skeleton className="h-4 w-1/3" /><Skeleton className="h-4 w-full" /><Skeleton className="h-4 w-5/6" /><Skeleton className="h-4 w-3/4" /></div></Card>}

      {answer && (
        <Card>
          <div className="flex items-center justify-between mb-5">
            <h3 className="font-semibold text-lg">Generated Answer</h3>
            <div className="flex gap-1">
              <Button variant="ghost" size="sm" icon="copy" onClick={copy}>Copy Answer</Button>
              <Button variant="ghost" size="sm" icon="save" onClick={() => toast('Answer saved', 'success')}>Save Answer</Button>
            </div>
          </div>
          <div className="space-y-5 text-sm">
            {[
              { h:'Definition', c:answer.definition },
              { h:'Introduction', c:answer.introduction },
            ].map(s => (
              <div key={s.h}>
                <h4 className="font-semibold text-slate-900 mb-1.5 flex items-center gap-2"><span className="w-1 h-4 bg-brand-500 rounded" /> {s.h}</h4>
                <p className="text-slate-700 leading-relaxed pl-3">{s.c}</p>
              </div>
            ))}
            <div>
              <h4 className="font-semibold text-slate-900 mb-1.5 flex items-center gap-2"><span className="w-1 h-4 bg-brand-500 rounded" /> Main Points</h4>
              <ul className="space-y-1.5 pl-3">
                {answer.mainPoints.map((p,i) => (
                  <li key={i} className="text-slate-700 flex gap-2"><Icon name="check-circle-2" size={14} className="text-emerald-500 flex-shrink-0 mt-0.5" />{p}</li>
                ))}
              </ul>
            </div>
            <div>
              <h4 className="font-semibold text-slate-900 mb-1.5 flex items-center gap-2"><span className="w-1 h-4 bg-brand-500 rounded" /> Explanation</h4>
              <p className="text-slate-700 leading-relaxed pl-3 whitespace-pre-wrap">{answer.explanation}</p>
            </div>
            <div>
              <h4 className="font-semibold text-slate-900 mb-1.5 flex items-center gap-2"><span className="w-1 h-4 bg-brand-500 rounded" /> Examples</h4>
              <p className="text-slate-700 leading-relaxed pl-3 whitespace-pre-wrap">{answer.examples}</p>
            </div>
            <div>
              <h4 className="font-semibold text-slate-900 mb-1.5 flex items-center gap-2"><span className="w-1 h-4 bg-brand-500 rounded" /> Conclusion</h4>
              <p className="text-slate-700 leading-relaxed pl-3">{answer.conclusion}</p>
            </div>
          </div>
        </Card>
      )}
    </div>
  );
}

/* -------- Progress -------- */
function Progress({ quizHistory, sessions }) {
  const totalMinutes = sessions.reduce((s,x) => s+x.minutes, 0);
  const todayMinutes = sessions.filter(s => s.date.slice(0,10) === todayDate()).reduce((a,b)=>a+b.minutes,0);
  const weekMinutes = sessions.reduce((s,x) => s+x.minutes, 0);

  const avgScore = quizHistory.length > 0 ? Math.round(quizHistory.reduce((s,q)=>s+q.accuracy,0)/quizHistory.length) : 0;
  const highestScore = quizHistory.length > 0 ? Math.max(...quizHistory.map(q => q.accuracy)) : 0;
  const totalQuestions = quizHistory.reduce((s,q) => s+q.totalQuestions, 0);

  // Weak topics
  const topicMap = {};
  quizHistory.forEach(q => {
    const k = `${q.subject}::${q.topic}`;
    if (!topicMap[k]) topicMap[k] = { subject:q.subject, topic:q.topic, total:0, correct:0 };
    topicMap[k].total += q.totalQuestions;
    topicMap[k].correct += q.correctCount;
  });
  const weakTopics = Object.values(topicMap).map(x => ({ ...x, accuracy: Math.round(x.correct/x.total*100) })).filter(x => x.accuracy < 75).sort((a,b)=>a.accuracy-b.accuracy).slice(0,5);

  // Weekly bars
  const days = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const weekBars = days.map((d, i) => ({ day:d, minutes: [45,60,30,75,50,120,90][i] }));
  const maxMin = Math.max(...weekBars.map(b => b.minutes));

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 flex items-center gap-2"><Icon name="bar-chart-3" size={26} className="text-brand-600" /> Progress Dashboard</h1>
        <p className="text-slate-600 mt-1">Track your study analytics and identify areas to improve.</p>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <Card><div className="text-xs text-slate-500 mb-1">Today</div><div className="text-2xl font-extrabold text-slate-900">{todayMinutes} <span className="text-sm font-medium text-slate-500">min</span></div><ProgressBar value={(todayMinutes/120)*100} className="mt-2" color="bg-brand-500" /></Card>
        <Card><div className="text-xs text-slate-500 mb-1">This Week</div><div className="text-2xl font-extrabold text-slate-900">{(weekMinutes/60).toFixed(1)} <span className="text-sm font-medium text-slate-500">hrs</span></div><ProgressBar value={(weekMinutes/1200)*100} className="mt-2" color="bg-emerald-500" /></Card>
        <Card><div className="text-xs text-slate-500 mb-1">This Month</div><div className="text-2xl font-extrabold text-slate-900">{(totalMinutes/60).toFixed(1)} <span className="text-sm font-medium text-slate-500">hrs</span></div><ProgressBar value={(totalMinutes/3000)*100} className="mt-2" color="bg-accent-500" /></Card>
        <Card><div className="text-xs text-slate-500 mb-1">Study Streak</div><div className="text-2xl font-extrabold text-slate-900">7 <span className="text-sm font-medium text-slate-500">days</span></div><div className="text-xs text-orange-500 font-semibold mt-1 flex items-center gap-1"><Icon name="flame" size={12} /> Keep going!</div></Card>
      </div>

      <div className="grid lg:grid-cols-2 gap-5">
        <Card>
          <h3 className="font-semibold text-lg mb-4 flex items-center gap-2"><Icon name="bar-chart" size={18} className="text-brand-600" /> Weekly Study Time</h3>
          <div className="flex items-end justify-between gap-2 h-40">
            {weekBars.map(b => (
              <div key={b.day} className="flex-1 flex flex-col items-center gap-2">
                <div className="text-[10px] font-semibold text-slate-500">{b.minutes}m</div>
                <div className="w-full bg-gradient-to-t from-brand-500 to-accent-500 rounded-t-lg transition-all hover:opacity-80" style={{ height:`${(b.minutes/maxMin)*100}%` }} />
                <div className="text-[10px] text-slate-500">{b.day}</div>
              </div>
            ))}
          </div>
        </Card>

        <Card>
          <h3 className="font-semibold text-lg mb-4 flex items-center gap-2"><Icon name="target" size={18} className="text-brand-600" /> Quiz Performance</h3>
          <div className="grid grid-cols-2 gap-3">
            <div className="rounded-xl bg-slate-50 p-3"><div className="text-xs text-slate-500">Average Score</div><div className="text-2xl font-extrabold text-slate-900">{avgScore}%</div></div>
            <div className="rounded-xl bg-slate-50 p-3"><div className="text-xs text-slate-500">Highest Score</div><div className="text-2xl font-extrabold text-emerald-600">{highestScore}%</div></div>
            <div className="rounded-xl bg-slate-50 p-3"><div className="text-xs text-slate-500">Questions Attempted</div><div className="text-2xl font-extrabold text-slate-900">{totalQuestions}</div></div>
            <div className="rounded-xl bg-slate-50 p-3"><div className="text-xs text-slate-500">Quizzes Taken</div><div className="text-2xl font-extrabold text-slate-900">{quizHistory.length}</div></div>
          </div>
        </Card>
      </div>

      <Card>
        <h3 className="font-semibold text-lg mb-4 flex items-center gap-2"><Icon name="book-open" size={18} className="text-brand-600" /> Subject Progress</h3>
        <div className="space-y-4">
          {SUBJECTS.map(s => (
            <div key={s.id}>
              <div className="flex items-center justify-between mb-1.5">
                <div className="flex items-center gap-2">
                  <div className={`w-7 h-7 rounded-lg bg-gradient-to-br ${s.color} flex items-center justify-center`}><Icon name={s.icon} size={14} className="text-white" /></div>
                  <span className="text-sm font-medium text-slate-800">{s.name}</span>
                </div>
                <span className="text-sm font-bold text-slate-800">{s.progress}%</span>
              </div>
              <ProgressBar value={s.progress} />
            </div>
          ))}
        </div>
      </Card>

      <Card>
        <h3 className="font-semibold text-lg mb-4 flex items-center gap-2"><Icon name="alert-triangle" size={18} className="text-amber-500" /> Topics to Improve</h3>
        {weakTopics.length === 0 ? (
          <EmptyState icon="party-popper" title="No weak topics detected" description="Take a quiz to see personalized weak-topic analysis." />
        ) : (
          <div className="space-y-3">
            {weakTopics.map((w, i) => (
              <div key={i} className="p-3 rounded-xl bg-amber-50 border border-amber-100">
                <div className="flex items-center justify-between mb-1">
                  <span className="font-semibold text-sm text-slate-800">{w.topic}</span>
                  <Badge variant={w.accuracy<50?'danger':'warning'}>{w.accuracy}%</Badge>
                </div>
                <div className="text-xs text-slate-600">{w.subject}</div>
                <div className="text-xs text-amber-800 mt-1.5 font-medium flex items-center gap-1"><Icon name="arrow-right" size={11} /> Review {w.topic} before attempting another quiz.</div>
              </div>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
}

/* -------- Resources -------- */
function Resources({ resources, setResources }) {
  const toast = useToast();
  const [search, setSearch] = useState('');
  const [filter, setFilter] = useState('All');
  const [modal, setModal] = useState(false);
  const [form, setForm] = useState({ title:'', subject:'Python', type:'Websites', description:'', link:'' });

  const types = ['All','Notes','PDFs','Videos','Websites','Books','Practice Questions'];

  const filtered = resources.filter(r => {
    if (filter !== 'All' && r.type !== filter) return false;
    if (search) return (r.title+r.description+r.subject).toLowerCase().includes(search.toLowerCase());
    return true;
  });

  const save = () => {
    if (!form.title.trim()) { toast('Enter a title', 'error'); return; }
    setResources([{ ...form, id:uid('r'), dateAdded:new Date().toISOString() }, ...resources]);
    setModal(false);
    setForm({ title:'', subject:'Python', type:'Websites', description:'', link:'' });
    toast('Resource added', 'success');
  };

  const del = (id) => { if (confirm('Delete resource?')) { setResources(resources.filter(r => r.id !== id)); toast('Deleted', 'success'); } };

  const typeIcon = { Notes:'notebook-pen', PDFs:'file-text', Videos:'video', Websites:'globe', Books:'book', 'Practice Questions':'help-circle' };

  return (
    <div className="space-y-5">
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 flex items-center gap-2"><Icon name="library" size={26} className="text-brand-600" /> Resource Library</h1>
          <p className="text-slate-600 mt-1">{resources.length} saved resources</p>
        </div>
        <Button icon="plus" onClick={() => setModal(true)}>Add Resource</Button>
      </div>

      <Card padding="p-4">
        <div className="flex flex-col gap-3">
          <div className="relative">
            <Icon name="search" size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search resources…" className="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-brand-500 outline-none text-sm" />
          </div>
          <div className="flex gap-2 overflow-x-auto scrollbar-thin pb-1">
            {types.map(t => (
              <button key={t} onClick={() => setFilter(t)} className={`flex-shrink-0 px-3 py-1.5 rounded-full text-xs font-semibold border transition ${filter===t?'bg-brand-600 text-white border-brand-600':'border-slate-200 text-slate-600 hover:bg-slate-50'}`}>{t}</button>
            ))}
          </div>
        </div>
      </Card>

      {filtered.length === 0 ? (
        <Card><EmptyState icon="library" title="No resources found" description="Add your first study resource to get started." action={<Button icon="plus" onClick={() => setModal(true)}>Add Resource</Button>} /></Card>
      ) : (
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {filtered.map(r => (
            <Card key={r.id} className="flex flex-col hover:shadow-lg transition">
              <div className="flex items-start justify-between mb-2">
                <div className="w-10 h-10 rounded-lg bg-gradient-to-br from-brand-500 to-accent-600 flex items-center justify-center">
                  <Icon name={typeIcon[r.type]||'file'} size={18} className="text-white" />
                </div>
                <Badge>{r.type}</Badge>
              </div>
              <h3 className="font-semibold text-slate-900 mb-1 line-clamp-2">{r.title}</h3>
              <p className="text-xs text-slate-500 mb-2">{r.subject}</p>
              <p className="text-sm text-slate-600 line-clamp-2 flex-1">{r.description}</p>
              <div className="flex items-center justify-between mt-3 pt-3 border-t border-slate-100">
                <span className="text-[11px] text-slate-400">{formatDate(r.dateAdded)}</span>
                <div className="flex gap-1">
                  {r.link && r.link !== '#' && <a href={r.link} target="_blank" rel="noopener noreferrer" className="p-1.5 rounded hover:bg-brand-50 text-brand-600"><Icon name="external-link" size={14} /></a>}
                  <button onClick={() => del(r.id)} className="p-1.5 rounded hover:bg-red-50 text-red-500"><Icon name="trash-2" size={14} /></button>
                </div>
              </div>
            </Card>
          ))}
        </div>
      )}

      <Modal open={modal} onClose={() => setModal(false)} title="Add Resource"
        footer={<><Button variant="secondary" onClick={() => setModal(false)}>Cancel</Button><Button icon="check" onClick={save}>Save</Button></>}>
        <div className="space-y-4">
          <Input label="Title" value={form.title} onChange={e => setForm({ ...form, title:e.target.value })} />
          <Select label="Subject" value={form.subject} onChange={e => setForm({ ...form, subject:e.target.value })} options={SUBJECTS.map(s => s.name)} />
          <Select label="Type" value={form.type} onChange={e => setForm({ ...form, type:e.target.value })} options={types.slice(1)} />
          <Textarea label="Description" value={form.description} onChange={e => setForm({ ...form, description:e.target.value })} rows={3} />
          <Input label="Link (optional)" value={form.link} onChange={e => setForm({ ...form, link:e.target.value })} placeholder="https://…" />
        </div>
      </Modal>
    </div>
  );
}

/* -------- Profile -------- */
function Profile({ quizHistory, notes, flashcardSets, tasks, exams }) {
  const [tab, setTab] = useState('activity');
  const tabs = [
    { id:'activity', label:'My Activity', icon:'activity' },
    { id:'notes', label:'Saved Notes', icon:'notebook-pen' },
    { id:'flashcards', label:'Flashcards', icon:'layers' },
    { id:'quizzes', label:'Quiz History', icon:'help-circle' },
    { id:'plans', label:'Study Plans', icon:'calendar-days' },
    { id:'settings', label:'Settings', icon:'settings' },
  ];

  const stats = [
    { l:'Total Study Hours', v:'24.5h' },
    { l:'Quizzes Completed', v:quizHistory.length },
    { l:'Topics Completed', v:18 },
    { l:'Average Score', v: quizHistory.length>0 ? `${Math.round(quizHistory.reduce((s,q)=>s+q.accuracy,0)/quizHistory.length)}%` : '84%' },
    { l:'Study Streak', v:'7 days' },
  ];

  return (
    <div className="space-y-5">
      <Card>
        <div className="flex flex-col sm:flex-row items-start sm:items-center gap-5">
          <div className="w-20 h-20 rounded-2xl bg-gradient-to-br from-brand-500 to-accent-600 flex items-center justify-center text-white font-extrabold text-2xl flex-shrink-0">AS</div>
          <div className="flex-1">
            <h1 className="text-2xl font-extrabold text-slate-900">Alex Sharma</h1>
            <p className="text-slate-600">B.Tech Computer Science · 3rd Year</p>
            <div className="flex flex-wrap gap-2 mt-2">
              {SUBJECTS.slice(0,5).map(s => <Badge key={s.id} variant="brand">{s.name}</Badge>)}
            </div>
            <p className="text-sm text-slate-600 mt-3 flex items-center gap-2"><Icon name="target" size={14} className="text-brand-600" /> Goal: Master ML fundamentals & ace finals</p>
          </div>
        </div>
        <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 mt-6 pt-6 border-t border-slate-100">
          {stats.map(s => (
            <div key={s.l} className="text-center">
              <div className="text-xl font-extrabold text-slate-900">{s.v}</div>
              <div className="text-[10px] text-slate-500 mt-0.5">{s.l}</div>
            </div>
          ))}
        </div>
      </Card>

      <div className="flex gap-2 overflow-x-auto scrollbar-thin pb-1">
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} className={`flex-shrink-0 flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-medium transition ${tab===t.id?'bg-brand-600 text-white':'bg-white text-slate-600 border border-slate-200 hover:bg-slate-50'}`}>
            <Icon name={t.icon} size={14} /> {t.label}
          </button>
        ))}
      </div>

      {tab === 'activity' && (
        <Card>
          <h3 className="font-semibold mb-4">Recent Activity</h3>
          <div className="space-y-3">
            {[
              { icon:'check-circle', c:'text-emerald-500', t:'Completed quiz on Python Recursion', d:'2 hours ago' },
              { icon:'notebook-pen', c:'text-brand-500', t:'Created note "Gradient Descent Explained"', d:'Yesterday' },
              { icon:'layers', c:'text-accent-500', t:'Reviewed 15 flashcards', d:'Yesterday' },
              { icon:'message-circle', c:'text-purple-500', t:'Asked AI about Neural Networks', d:'2 days ago' },
              { icon:'calendar-days', c:'text-amber-500', t:'Completed 4 study tasks', d:'3 days ago' },
            ].map((a,i) => (
              <div key={i} className="flex items-center gap-3 p-3 rounded-xl hover:bg-slate-50">
                <div className={`w-9 h-9 rounded-lg bg-slate-100 flex items-center justify-center ${a.c}`}><Icon name={a.icon} size={16} /></div>
                <div className="flex-1"><div className="text-sm text-slate-700">{a.t}</div><div className="text-xs text-slate-400">{a.d}</div></div>
              </div>
            ))}
          </div>
        </Card>
      )}

      {tab === 'notes' && (
        <Card>
          <h3 className="font-semibold mb-4">Saved Notes ({notes.length})</h3>
          <div className="grid sm:grid-cols-2 gap-3">
            {notes.slice(0,6).map(n => (
              <div key={n.id} className="p-3 rounded-xl border border-slate-100 hover:bg-slate-50">
                <Badge variant="brand" className="mb-2">{n.subject}</Badge>
                <div className="font-semibold text-sm text-slate-800 mb-1">{n.title}</div>
                <div className="text-xs text-slate-500 line-clamp-2">{n.content}</div>
              </div>
            ))}
          </div>
        </Card>
      )}

      {tab === 'flashcards' && (
        <Card>
          <h3 className="font-semibold mb-4">Flashcard Decks ({flashcardSets.length})</h3>
          <div className="space-y-2">
            {flashcardSets.map(s => (
              <div key={s.id} className="flex items-center gap-3 p-3 rounded-xl border border-slate-100">
                <div className="w-9 h-9 rounded-lg bg-accent-100 flex items-center justify-center"><Icon name="layers" size={16} className="text-accent-600" /></div>
                <div className="flex-1"><div className="font-medium text-sm">{s.name}</div><div className="text-xs text-slate-500">{s.cards.length} cards</div></div>
                <Badge variant="brand">{s.subject}</Badge>
              </div>
            ))}
          </div>
        </Card>
      )}

      {tab === 'quizzes' && (
        <Card>
          <h3 className="font-semibold mb-4">Quiz History ({quizHistory.length})</h3>
          {quizHistory.length === 0 ? (
            <p className="text-sm text-slate-500">No quizzes taken yet.</p>
          ) : (
            <div className="space-y-2">
              {quizHistory.map(q => (
                <div key={q.id} className="flex items-center gap-3 p-3 rounded-xl border border-slate-100">
                  <div className={`w-9 h-9 rounded-lg flex items-center justify-center ${q.accuracy>=70?'bg-emerald-100 text-emerald-600':q.accuracy>=50?'bg-amber-100 text-amber-600':'bg-red-100 text-red-600'}`}>
                    <Icon name="help-circle" size={16} />
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="font-medium text-sm truncate">{q.subject} — {q.topic}</div>
                    <div className="text-xs text-slate-500">{q.correctCount}/{q.totalQuestions} · {formatDate(q.date)}</div>
                  </div>
                  <Badge variant={q.accuracy>=70?'success':q.accuracy>=50?'warning':'danger'}>{q.accuracy}%</Badge>
                </div>
              ))}
            </div>
          )}
        </Card>
      )}

      {tab === 'plans' && (
        <Card>
          <h3 className="font-semibold mb-4">Study Plans ({tasks.length} tasks · {exams.length} exams)</h3>
          <div className="grid sm:grid-cols-2 gap-3">
            {exams.slice(0,4).map(e => (
              <div key={e.id} className="p-3 rounded-xl border border-slate-100">
                <Badge variant="brand" className="mb-2">{e.subject}</Badge>
                <div className="font-semibold text-sm">{e.name}</div>
                <div className="text-xs text-slate-500 mt-0.5">{daysBetween(e.date)} days remaining · {e.preparation}% prepared</div>
              </div>
            ))}
          </div>
        </Card>
      )}

      {tab === 'settings' && <SettingsInline />}
    </div>
  );
}

/* -------- Settings -------- */
function SettingsInline() {
  const toast = useToast();
  const [prefs, setPrefs] = useLocalStorage('studymate:prefs', { theme:'light', emailNotif:true, aiMode:'detailed' });
  return (
    <Card>
      <h3 className="font-semibold mb-4">Preferences</h3>
      <div className="space-y-4">
        <Select label="Default AI Mode" value={prefs.aiMode} onChange={e => setPrefs({ ...prefs, aiMode:e.target.value })} options={['beginner','exam','detailed','revision']} />
        <label className="flex items-center justify-between">
          <span className="text-sm text-slate-700">Email notifications</span>
          <input type="checkbox" checked={prefs.emailNotif} onChange={e => setPrefs({ ...prefs, emailNotif:e.target.checked })} className="rounded" />
        </label>
        <div className="flex items-center justify-between">
          <span className="text-sm text-slate-700">Clear all local data</span>
          <Button variant="danger" size="sm" icon="trash-2" onClick={() => { if (confirm('This will clear all saved data. Continue?')) { localStorage.clear(); toast('All data cleared. Reloading…', 'success'); setTimeout(() => window.location.reload(), 1000); } }}>Clear Data</Button>
        </div>
      </div>
      <Button className="mt-4" icon="check" onClick={() => toast('Preferences saved', 'success')}>Save Preferences</Button>
    </Card>
  );
}

function Settings() {
  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl sm:text-3xl font-extrabold text-slate-900 flex items-center gap-2"><Icon name="settings" size={26} className="text-brand-600" /> Settings</h1>
        <p className="text-slate-600 mt-1">Manage your preferences and data.</p>
      </div>
      <SettingsInline />
    </div>
  );
}

/* =========================== APP =========================== */
function App() {
  const [route, navigate] = useHashRoute();
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [searchOpen, setSearchOpen] = useState(false);
  const [notifOpen, setNotifOpen] = useState(false);

  const [notes, setNotes] = useLocalStorage(STORAGE_KEYS.NOTES, DEMO_NOTES);
  const [tasks, setTasks] = useLocalStorage(STORAGE_KEYS.TASKS, DEMO_TASKS);
  const [exams, setExams] = useLocalStorage(STORAGE_KEYS.EXAMS, DEMO_EXAMS);
  const [resources, setResources] = useLocalStorage(STORAGE_KEYS.RESOURCES, DEMO_RESOURCES);
  const [flashcardSets, setFlashcardSets] = useLocalStorage(STORAGE_KEYS.FLASHCARDS, []);
  const [quizHistory, setQuizHistory] = useLocalStorage(STORAGE_KEYS.QUIZZES, []);

  const sessions = useMemo(() => ([
    { id:'s1', date:new Date().toISOString(), minutes:45, subject:'Python' },
    { id:'s2', date:new Date().toISOString(), minutes:30, subject:'SQL' },
    { id:'s3', date:new Date().toISOString(), minutes:60, subject:'Machine Learning' },
  ]), []);

  const notifications = useMemo(() => ([
    { id:'n1', type:'warning', message:'Your Machine Learning exam is in 12 days.', timestamp:new Date().toISOString(), read:false },
    { id:'n2', type:'success', message:'Your study streak is now 7 days! 🔥', timestamp:new Date().toISOString(), read:false },
    { id:'n3', type:'info', message:'You have 2 incomplete study tasks.', timestamp:new Date().toISOString(), read:false },
    { id:'n4', type:'success', message:'Your quiz score improved by 12%.', timestamp:new Date().toISOString(), read:false },
  ]), []);
  const [notifs, setNotifs] = useState(notifications);
  const unreadCount = notifs.filter(n => !n.read).length;

  // Keyboard shortcut
  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); setSearchOpen(true); }
      if (e.key === 'Escape') { setSearchOpen(false); setNotifOpen(false); }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const openNotifs = () => { setNotifOpen(true); setNotifs(notifs.map(n => ({ ...n, read:true }))); };

  // Landing
  if (route === '/landing' || route === '/') {
    if (route === '/') {
      // still show landing on '/' if user hasn't entered app; use ?app=1 or hash to distinguish
    }
  }
  if (route === '/landing') {
    return <Landing navigate={navigate} />;
  }

  // Simpler: if hash is empty, show landing; if hash begins with '#/app', show app
  // Here we'll treat '/' as dashboard (in-app), and '/landing' as landing page.
  // Make header of app link to /landing.

  const pageMap = {
    '/': <Dashboard navigate={navigate} notes={notes} tasks={tasks} setTasks={setTasks} exams={exams} quizHistory={quizHistory} sessions={sessions} />,
    '/tutor': <AITutor />,
    '/notes': <Notes notes={notes} setNotes={setNotes} navigate={navigate} />,
    '/analyzer': <NoteAnalyzer navigate={navigate} />,
    '/documents': <DocumentAnalyzer navigate={navigate} />,
    '/summarizer': <Summarizer notes={notes} navigate={navigate} />,
    '/quiz': <QuizGenerator quizHistory={quizHistory} setQuizHistory={setQuizHistory} />,
    '/flashcards': <Flashcards flashcardSets={flashcardSets} setFlashcardSets={setFlashcardSets} />,
    '/planner': <StudyPlanner tasks={tasks} setTasks={setTasks} exams={exams} />,
    '/exams': <ExamCountdown exams={exams} setExams={setExams} />,
    '/exam-answer': <ExamAnswerGenerator />,
    '/progress': <Progress quizHistory={quizHistory} sessions={sessions} />,
    '/resources': <Resources resources={resources} setResources={setResources} />,
    '/profile': <Profile quizHistory={quizHistory} notes={notes} flashcardSets={flashcardSets} tasks={tasks} exams={exams} />,
    '/settings': <Settings />,
  };

  const page = pageMap[route] || <Dashboard navigate={navigate} notes={notes} tasks={tasks} setTasks={setTasks} exams={exams} quizHistory={quizHistory} sessions={sessions} />;

  return (
    <div className="min-h-screen bg-slate-50">
      <div className="flex">
        <Sidebar route={route} navigate={navigate} open={sidebarOpen} onClose={() => setSidebarOpen(false)} />
        <div className="flex-1 min-w-0 flex flex-col">
          <Topbar
            onMenu={() => setSidebarOpen(true)}
            onSearch={() => setSearchOpen(true)}
            onNotifications={openNotifs}
            navigate={navigate}
            notificationsCount={unreadCount}
          />
          <main className="flex-1 p-4 sm:p-6 max-w-7xl w-full mx-auto">
            <div className="mb-4 flex items-center gap-2 text-xs text-slate-500">
              <button onClick={() => navigate('/landing')} className="hover:text-brand-600 font-medium flex items-center gap-1">
                <Icon name="home" size={12} /> Landing Page
              </button>
            </div>
            {page}
          </main>
          <footer className="border-t border-slate-100 bg-white px-6 py-4 text-center text-xs text-slate-500">
            StudyMate AI · Study Smarter. Understand Faster. · AI content should be verified for accuracy.
          </footer>
        </div>
      </div>

      <GlobalSearch open={searchOpen} onClose={() => setSearchOpen(false)} navigate={navigate} notes={notes} resources={resources} />
      <NotificationPanel open={notifOpen} onClose={() => setNotifOpen(false)} notifications={notifs} setNotifications={setNotifs} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <ToastProvider>
    <App />
  </ToastProvider>
);
</script>
</body>
</html>
